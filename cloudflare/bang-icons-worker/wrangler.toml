name = "blanc-bang-icons"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Same-origin icons for blanc.day/bangs: these routes carve /bang-icons/* out
# of the blanc.day Pages site, as blanc-ping's do for /dl/*, so the site's
# `img-src 'self'` policy needs no change. No workers.dev address.
workers_dev = false
routes = [
  { pattern = "blanc.day/bang-icons/*", zone_name = "blanc.day" },
  { pattern = "www.blanc.day/bang-icons/*", zone_name = "blanc.day" }
]

# Created by `npx wrangler kv namespace create ICONS` (see README.md).
kv_namespaces = [
  { binding = "ICONS", id = "SET-ME-ICONS-NAMESPACE-ID" }
]

# A backstop on top of the parser's bounds: no request may spend more than
# one second of CPU (wall time waiting on sites does not count). Needs the
# Workers Paid plan, which the README's first deploy step checks.
[limits]
cpu_ms = 1000

[vars]
HOSTS_URL = "https://blanc.day/bang-hosts.json"

# Nothing about visitors is kept: no Workers Logs.
[observability]
enabled = false
