name = "blanc-sync"
main = "src/index.js"
compatibility_date = "2026-07-01"
# Reviewed cutover configuration only; do not deploy without owner approval.
# Keep the production endpoint while preventing old Version URLs from writing
# around the account's SQLite quota/erasure path.
workers_dev = true
preview_urls = false

# Create with: wrangler kv namespace create SYNC  → paste the id below.
[[kv_namespaces]]
binding = "SYNC"
id = "0e6ba79c73d64d77bbb76886666c33d5"

[vars]
NEW_ACCOUNT_DAILY_LIMIT = "100"
ACCOUNT_STORAGE_QUOTA_BYTES = "20971520"
ACCOUNT_STORAGE_MAX_STORES = "256"
CLEANUP_MAX_DELETES = "1000"
CLEANUP_ENABLED = "false"

[[durable_objects.bindings]]
name = "ACCOUNT_QUOTA"
class_name = "AccountQuota"

[[migrations]]
tag = "v1-account-quota"
new_sqlite_classes = ["AccountQuota"]

[triggers]
# Inactivity cleanup is paused. Re-enabling it requires a reviewed quota-aware
# implementation; disabling its flag alone does not drain old invocations.
crons = []

# Keep the Worker's own console lines (the daily cleanup summary logs only
# counts) but not per-request invocation logs: request URLs carry the account
# locator, which is a bearer capability and must not be persisted.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
