name = "blanc-linux-packages"
main = "index.mjs"
account_id = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
compatibility_date = "2026-11-21"
workers_dev = false
preview_urls = false

# The owner fills in the account ID and the two provisioned bucket names in Task 8.
[env.staging]
name = "blanc-linux-packages-staging"
routes = [{ pattern = "pkg-staging.blanc.day", custom_domain = true }]

[[env.staging.r2_buckets]]
binding = "PACKAGES"
bucket_name = "REPLACE_WITH_STAGING_BUCKET"
remote = true

[env.production]
name = "blanc-linux-packages"
routes = [{ pattern = "pkg.blanc.day", custom_domain = true }]

[[env.production.r2_buckets]]
binding = "PACKAGES"
bucket_name = "REPLACE_WITH_PRODUCTION_BUCKET"
remote = true

