# Outbound-isolation check (S1.1): every TCP or UDP packet the test user
# sends off this Mac, IPv4 or IPv6, is dropped and logged to pflog0. Loopback
# stays open: the recording proxy and the fixture servers live there. Only the
# test user's sockets match; nothing else on the Mac is affected.
block drop out log quick on ! lo0 proto { tcp, udp } from any to any user @UID@
