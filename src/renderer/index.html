<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data: blanc:;" />
  <title>Blanc</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome">
    <div id="strip">
      <button
        id="mainMenuButton"
        class="no-drag"
        type="button"
        title="Main menu (Alt+F)"
        aria-label="Main menu"
        aria-haspopup="menu"
        aria-expanded="false"
        hidden
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 4.5h10M3 8h10M3 11.5h10"/>
        </svg>
      </button>
      <div id="islandPill" class="no-drag" role="button" tabindex="0" title="Search, tabs & commands (Ctrl/Cmd+L)">
        <div id="pillNav" class="pill-btns"></div>
        <div id="pillDots"></div>
        <span id="pillFavicon" class="favicon"></span>
        <button id="pillInsecure" class="insecure-badge" type="button" aria-expanded="false" aria-label="Not secure — this site uses an unencrypted connection. Open site controls." title="Not secure — this site uses an unencrypted connection (HTTP)" hidden>
          <svg viewBox="0 0 16 16"><rect x="3.25" y="7.25" width="9.5" height="6" rx="1.75"/><path d="M5.5 7.25V4.9a2.6 2.6 0 0 1 5.1-.72"/></svg>
        </button>
        <span id="pillDomain">new tab</span>
        <span id="pillShortcuts" class="pill-shortcuts">
          <button id="pillSlash" class="pill-slash" type="button" title="Commands (/)" aria-label="Commands (/)" hidden>/</button>
        </span>
        <button id="pillPrivateChip" title="Leave private mode — closes this tab" hidden>private
          <svg viewBox="0 0 16 16"><path d="M4.75 4.75l6.5 6.5M11.25 4.75l-6.5 6.5"/></svg>
        </button>
        <button id="pillSourceChip" title="Close this page source view" hidden>source
          <svg viewBox="0 0 16 16"><path d="M4.75 4.75l6.5 6.5M11.25 4.75l-6.5 6.5"/></svg>
        </button>
        <button id="pillCapture" class="capture-chip" type="button" aria-expanded="false" hidden>
          <svg id="pillCaptureMic" viewBox="0 0 16 16" aria-hidden="true" hidden>
            <rect x="6" y="2.2" width="4" height="7" rx="2"/>
            <path d="M3.8 8.2a4.2 4.2 0 0 0 8.4 0M8 12.4v1.8"/>
          </svg>
          <svg id="pillCaptureCam" viewBox="0 0 16 16" aria-hidden="true" hidden>
            <rect x="2.2" y="4.6" width="8.2" height="6.8" rx="1.6"/>
            <path d="M10.4 7.2l3.4-1.8v5.2l-3.4-1.8z"/>
          </svg>
        </button>
        <button id="pillFillHint" class="fill-hint-chip" type="button" title="Fill login from 1Password (⌥⌘P)" aria-label="Fill login from 1Password (⌥⌘P)" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="6.4" r="3.1"/><path d="M8.3 8.7 13.2 13.6M10.9 11.3l1.7-1.7M12.7 13.1l1.3-1.3"/></svg>
        </button>
        <button id="pillShield" class="shield" aria-expanded="false" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l5 1.9v3.8c0 3.1-2.1 5.3-5 6.7-2.9-1.4-5-3.6-5-6.7V3.7z"/><path d="M4.4 11.47 12.61 3.55"/></svg>
          <span id="pillShieldCount"></span>
        </button>
        <span class="pill-sep"></span>
        <div id="pillActions" class="pill-btns"></div>
      </div>
      <header id="glanceHeader" class="glance-header no-drag" role="group" aria-labelledby="glanceEyebrow" hidden>
        <div class="glance-copy">
          <span id="glanceEyebrow" class="glance-eyebrow">GLANCE</span>
          <span class="glance-tab-identity">
            <span id="glanceFavicon" class="favicon" aria-hidden="true"></span>
            <span id="glanceTitle"></span>
          </span>
        </div>
        <div class="glance-actions">
          <button id="glancePromote" class="glance-action glance-promote" type="button" title="Make Glance the main page" aria-label="Make Glance the main page">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.25 3.5 10.75 8l-4.5 4.5"/></svg>
            <span>Make main</span>
          </button>
          <button id="glanceChange" class="glance-action" type="button" title="Choose a different tab for Glance" aria-expanded="false">Change</button>
          <button id="glanceClose" class="glance-close" type="button" title="Close Glance" aria-label="Close Glance">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.75 4.75l6.5 6.5M11.25 4.75l-6.5 6.5"/></svg>
          </button>
        </div>
      </header>
      <div id="windowControls" class="no-drag"></div>
      <div id="glanceStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>
    <div
      id="glanceDivider"
      class="glance-divider no-drag"
      role="separator"
      aria-label="Resize Glance"
      aria-valuemin="50"
      aria-valuemax="78"
      aria-valuenow="62"
      tabindex="0"
      title="Drag to resize; double-click to reset"
      hidden
    ><span aria-hidden="true"></span></div>
  </div>
  <aside id="verticalTabsRail" class="vertical-tabs-rail no-drag" aria-label="Vertical tabs" hidden>
    <div class="vertical-tabs-toolbar">
      <button
        id="verticalTabsUseIsland"
        class="vertical-tabs-layout-button"
        type="button"
        title="Turn vertical tabs off"
        aria-label="Turn vertical tabs off"
        data-focus-key="layout:island"
      >
        <span class="vertical-tabs-layout-icon" aria-hidden="true"></span>
      </button>
    </div>
    <div id="verticalTabsList" class="vertical-tabs-list" role="list" aria-label="Open tabs"></div>
    <div class="vertical-tabs-footer">
      <button
        id="verticalTabsNew"
        class="vertical-tabs-new"
        type="button"
        aria-label="New tab"
        data-focus-key="action:new-tab"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
        <span>New tab</span>
        <kbd id="verticalTabsNewShortcut"></kbd>
      </button>
    </div>
    <div
      id="verticalTabsResizeHandle"
      class="vertical-tabs-resize-handle"
      role="separator"
      aria-label="Resize vertical tabs"
      aria-orientation="vertical"
      aria-valuemin="200"
      aria-valuemax="360"
      aria-valuenow="248"
      tabindex="0"
      title="Drag to resize; double-click to reset"
    ></div>
    <div id="verticalTabsAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </aside>
  <script src="pages/type-to-open.js"></script>
  <script src="vertical-tabs.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
