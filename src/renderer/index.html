<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data: blanc:;" />
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <title data-i18n="app.title">Blanc</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome">
    <div id="strip">
      <div id="dragBand" aria-hidden="true"></div>
      <button
        id="mainMenuButton"
        class="no-drag"
        type="button"
        data-tooltip="Main menu (Alt+F)"
        aria-label="Main menu"
        data-i18n-tooltip="menu.main.title"
        data-i18n-aria-label="menu.main.label"
        aria-haspopup="menu"
        aria-expanded="false"
        hidden
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 4.5h10M3 8h10M3 11.5h10"/>
        </svg>
      </button>
      <div id="islandPill" class="no-drag" role="button" tabindex="0" aria-label="Search, tabs & commands (Ctrl/Cmd+L)" data-tooltip="Search, tabs & commands (Ctrl/Cmd+L)" data-i18n-aria-label="pill.title" data-i18n-tooltip="pill.title">
        <button id="pillSpace" class="space-mark" type="button" aria-haspopup="dialog" aria-expanded="false" data-state="none" hidden>
          <span id="pillSpaceSymbol" class="space-mark-symbol" aria-hidden="true"></span>
          <span id="pillSpaceName" class="space-mark-name" data-i18n-ignore></span>
        </button>
        <div id="pillNav" class="pill-btns"></div>
        <div id="pillDots"></div>
        <span id="pillFavicon" class="favicon"></span>
        <button id="pillInsecure" class="insecure-badge" type="button" aria-expanded="false" aria-label="Not secure — this site uses an unencrypted connection. Open site controls." data-tooltip="Not secure — this site uses an unencrypted connection (HTTP)" data-i18n-aria-label="pill.insecure.label" data-i18n-tooltip="pill.insecure.title" hidden>
          <svg viewBox="0 0 16 16"><rect x="3.25" y="7.25" width="9.5" height="6" rx="1.75"/><path d="M5.5 7.25V4.9a2.6 2.6 0 0 1 5.1-.72"/></svg>
        </button>
        <span id="pillDomain" data-i18n="pill.domainDefault">new tab</span>
        <span id="pillShortcuts" class="pill-shortcuts">
          <button id="pillSlash" class="pill-slash" type="button" data-tooltip="Commands (/)" aria-label="Commands (/)" data-i18n-tooltip="pill.commands" data-i18n-aria-label="pill.commands" hidden>/</button>
        </span>
        <button id="pillPrivateChip" data-tooltip="Leave private mode — closes this tab" data-i18n-tooltip="pill.private.title" hidden><span data-i18n="pill.private.chip">Private</span>
          <svg viewBox="0 0 16 16"><path d="M4.75 4.75l6.5 6.5M11.25 4.75l-6.5 6.5"/></svg>
        </button>
        <button id="pillSourceChip" data-tooltip="Close this page source view" data-i18n-tooltip="pill.source.title" hidden><span data-i18n="pill.source.chip">source</span>
          <svg viewBox="0 0 16 16"><path d="M4.75 4.75l6.5 6.5M11.25 4.75l-6.5 6.5"/></svg>
        </button>
        <button id="pillCapture" class="capture-chip" type="button" aria-expanded="false" hidden>
          <svg id="pillCaptureMic" viewBox="0 0 16 16" aria-hidden="true" hidden>
            <rect x="6" y="2.2" width="4" height="7" rx="2"/>
            <path d="M3.8 8.2a4.2 4.2 0 0 0 8.4 0M8 12.4v1.8"/>
          </svg>
          <svg id="pillCaptureCam" viewBox="0 0 16 16" aria-hidden="true" hidden>
            <rect x="2.2" y="4.6" width="8.2" height="6.8" rx="1.6"/>
            <path d="M10.4 7.2l3.4-1.8v5.2l-3.4-1.8z"/>
          </svg>
        </button>
        <button id="pillDisplayShare" class="capture-chip display-share-chip" type="button" aria-expanded="false" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="3" width="12" height="8" rx="1.4"/>
            <path d="M6 13h4M8 11v2"/>
          </svg>
        </button>
        <button id="pillFillHint" class="fill-hint-chip" type="button" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="6.4" r="3.1"/><path d="M8.3 8.7 13.2 13.6M10.9 11.3l1.7-1.7M12.7 13.1l1.3-1.3"/></svg>
        </button>
        <button id="pillShield" class="shield" aria-expanded="false" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l5 1.9v3.8c0 3.1-2.1 5.3-5 6.7-2.9-1.4-5-3.6-5-6.7V3.7z"/><path d="M4.4 11.47 12.61 3.55"/></svg>
          <span id="pillShieldCount"></span>
        </button>
        <span class="pill-sep"></span>
        <div id="pillActions" class="pill-btns"></div>
      </div>
      <!-- The floating Glance card (blanc-chrome://glance/ only): its border,
           shadow and resize ring around the Glance page, and its header. -->
      <div id="glanceCard" class="glance-card no-drag" hidden>
        <span class="glance-card-edge" data-edge="n" aria-hidden="true"></span>
        <span class="glance-card-edge" data-edge="s" aria-hidden="true"></span>
        <span class="glance-card-edge" data-edge="e" aria-hidden="true"></span>
        <span class="glance-card-edge" data-edge="w" aria-hidden="true"></span>
        <span class="glance-card-edge" data-edge="ne" aria-hidden="true"></span>
        <span class="glance-card-edge" data-edge="nw" aria-hidden="true"></span>
        <span class="glance-card-edge" data-edge="se" aria-hidden="true"></span>
        <span class="glance-card-edge" data-edge="sw" aria-hidden="true"></span>
      <header id="glanceHeader" class="glance-header no-drag" role="group" aria-labelledby="glanceEyebrow" data-i18n-ignore="title" hidden>
        <div class="glance-copy">
          <span id="glanceEyebrow" class="glance-eyebrow" data-i18n="glance.eyebrow">GLANCE</span>
          <span class="glance-nav">
            <button id="glanceBack" class="glance-nav-btn" type="button" data-tooltip="Back" aria-label="Back" data-i18n-tooltip="pill.back" data-i18n-aria-label="pill.back" disabled></button>
            <button id="glanceReload" class="glance-nav-btn" type="button" data-tooltip="Reload" aria-label="Reload" data-i18n-tooltip="pill.reload" data-i18n-aria-label="pill.reload"></button>
          </span>
          <span class="glance-tab-identity">
            <span id="glanceFavicon" class="favicon" aria-hidden="true"></span>
            <span id="glanceTitle" data-i18n-ignore></span>
            <span id="glancePrivate" class="row-private" hidden data-i18n="rail.state.private">private</span>
          </span>
        </div>
        <div class="glance-actions">
          <button id="glanceChange" class="glance-action" type="button" data-tooltip="Choose a different tab for Glance" aria-label="Change" data-i18n-tooltip="glance.change.title" data-i18n-aria-label="glance.change" aria-expanded="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h9.5L10 3.5M13 10H3.5L6 12.5"/></svg>
            <span class="glance-action-label" data-i18n="glance.change">Change</span>
          </button>
          <button id="glanceOpenAsTab" class="glance-action glance-open-tab" type="button" data-tooltip="Open as tab — make this page the current tab" aria-label="Open as tab — make this page the current tab" data-i18n-tooltip="glance.openAsTab.title" data-i18n-aria-label="glance.openAsTab.title">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3L7.5 8.5M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg>
            <span class="glance-action-label" data-i18n="glance.openAsTab">Open as tab</span>
          </button>
          <button id="glanceKeepSplit" class="glance-action glance-keep-split" type="button" data-tooltip="Keep as split" aria-label="Keep as split" data-i18n-tooltip="split.keepAsSplit" data-i18n-aria-label="split.keepAsSplit">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M8 3.5v9"/></svg>
            <span class="glance-action-label" data-i18n="split.keepAsSplit">Keep as split</span>
          </button>
          <span id="glanceMove" class="glance-move" role="button" tabindex="0" aria-label="Move or resize Glance" data-i18n-aria-label="glance.move" data-tooltip="Move or resize Glance" data-i18n-tooltip="glance.move" aria-describedby="glanceMoveHint">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11M8 2.5L6.5 4M8 2.5L9.5 4M8 13.5L6.5 12M8 13.5L9.5 12M2.5 8L4 6.5M2.5 8L4 9.5M13.5 8L12 6.5M13.5 8L12 9.5"/></svg>
          </span>
          <button id="glanceClose" class="glance-close" type="button" data-tooltip="Close Glance" aria-label="Close Glance" data-i18n-tooltip="glance.close" data-i18n-aria-label="glance.close">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.75 4.75l6.5 6.5M11.25 4.75l-6.5 6.5"/></svg>
          </button>
        </div>
      </header>
        <span id="glanceMoveHint" class="sr-only" data-i18n="glance.move.hint">Arrow keys move it. Option or Alt with an arrow key resizes it. Enter resets it.</span>
        <div id="glanceCardStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      </div>
      <div id="windowControls" class="no-drag"></div>
      <div id="glanceStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>
    <!-- Split View (F53): one header band per pane and the dividers, drawn in
         the space the page views leave free (spec D5). -->
    <div id="splitPanes" class="split-panes no-drag" hidden></div>
  </div>
  <aside id="verticalTabsRail" class="vertical-tabs-rail no-drag" aria-label="Vertical tabs" data-i18n-aria-label="rail.label" hidden>
    <div class="vertical-tabs-toolbar">
      <button
        id="verticalTabsUseIsland"
        class="vertical-tabs-layout-button"
        type="button"
        data-tooltip="Turn vertical tabs off"
        aria-label="Turn vertical tabs off"
        data-i18n-tooltip="rail.islandLayout"
        data-i18n-aria-label="rail.islandLayout"
        data-focus-key="layout:island"
      >
        <span class="vertical-tabs-layout-icon" aria-hidden="true"></span>
      </button>
    </div>
    <div id="verticalTabsList" class="vertical-tabs-list" role="list" aria-label="Open tabs" data-i18n-aria-label="rail.list"></div>
    <div class="vertical-tabs-footer">
      <button
        id="verticalTabsNew"
        class="vertical-tabs-new"
        type="button"
        aria-label="New tab"
        data-i18n-aria-label="tab.new"
        data-focus-key="action:new-tab"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
        <span data-i18n="tab.new">New tab</span>
        <kbd id="verticalTabsNewShortcut" data-i18n-ignore></kbd>
      </button>
    </div>
    <div
      id="verticalTabsResizeHandle"
      class="vertical-tabs-resize-handle"
      role="separator"
      aria-label="Resize vertical tabs"
      data-i18n-aria-label="rail.resize"
      aria-orientation="vertical"
      aria-valuemin="200"
      aria-valuemax="360"
      aria-valuenow="248"
      tabindex="0"
      title="Drag to resize; double-click to reset"
      data-i18n-title="resize.hint"
    ></div>
    <div id="verticalTabsAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </aside>
  <script src="pages/type-to-open.js"></script>
  <script src="tab-sections.js"></script>
  <script src="tab-drag.js"></script>
  <script src="vertical-tabs.js"></script>
  <script src="space-identity.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
