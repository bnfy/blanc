<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; worker-src 'self';" />
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <title data-i18n="tabImport.title">Bring Your Tabs</title>
  <link rel="icon" type="image/png" href="icon-sunrise.png" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body class="sheet">
  <div class="page tab-import-page">
    <nav class="page-nav">
      <a href="blanc://settings/" data-i18n="pagesNav.settings">Settings</a>
      <a href="blanc://bookmarks/" data-i18n="pagesNav.bookmarks">Favorites</a>
      <a href="blanc://history/" data-i18n="pagesNav.history">History</a>
      <a href="blanc://downloads/" data-i18n="pagesNav.downloads">Downloads</a>
    </nav>
    <header class="tab-import-header">
      <h1 data-i18n="tabImport.heading">Bring your tabs</h1>
      <p id="tabImportStepProgress" aria-live="polite"></p>
    </header>
    <p id="tabImportStatus" class="section-hint tab-import-status" role="status" aria-live="polite"></p>
    <p id="tabImportAnnounce" class="page-sr-only" aria-live="polite"></p>
    <section class="tab-import-panel" data-step-panel="source" aria-labelledby="tabImportSourceTitle">
      <h2 id="tabImportSourceTitle" class="section-title tab-import-panel-title" data-i18n="tabImport.source.title">Choose a browser</h2>
      <div id="tabImportBrowserList" class="tab-import-browser-list" role="radiogroup" aria-label="Browsers" data-i18n-aria-label="tabImport.source.browsers"></div>
      <div id="tabImportSourceRecovery" class="tab-import-source-recovery" hidden></div>
      <div id="tabImportProfileSection" class="tab-import-profile-section" hidden>
        <div class="tab-import-profile-head">
          <h3 id="tabImportProfileTitle" class="tab-import-profile-title" data-i18n="tabImport.source.profileTitle">Choose a profile</h3>
        </div>
        <div id="tabImportSourceList" class="tab-import-source-list"></div>
      </div>
      <div id="arcImportEntry" class="arc-import-entry" hidden></div>
    </section>
    <section class="tab-import-panel" data-arc-panel="preview" hidden aria-labelledby="arcImportTitle"></section>
    <section class="tab-import-panel" data-arc-panel="result" hidden></section>
    <section class="tab-import-panel" data-step-panel="tabs" hidden aria-labelledby="tabImportTabsTitle">
      <h2 id="tabImportTabsTitle" class="section-title tab-import-panel-title" data-i18n="tabImport.tabs.title">Choose tabs</h2>
      <div class="tab-import-preview-toolbar">
        <div class="tab-import-selection-actions">
          <button id="tabImportSelectAll" type="button" class="tab-import-secondary" data-i18n="tabImport.tabs.selectAll">Select all</button>
          <button id="tabImportSelectNone" type="button" class="tab-import-secondary" data-i18n="tabImport.tabs.selectNone">Select none</button>
        </div>
        <span id="tabImportSelectedCount" class="tab-import-badge"></span>
      </div>
      <div id="tabImportTabsList" class="tab-import-tabs-list"></div>
      <div class="tab-import-panel-actions">
        <button id="tabImportBackToSource" type="button" class="tab-import-secondary" data-i18n="tabImport.tabs.back">Back to source</button>
        <button id="tabImportContinueToOrganize" type="button" class="tab-import-primary" data-i18n="tabImport.tabs.continue">Organize selected tabs</button>
      </div>
    </section>
    <section class="tab-import-panel" data-step-panel="organize" hidden aria-labelledby="tabImportOrganizeTitle">
      <h2 id="tabImportOrganizeTitle" class="section-title tab-import-panel-title" data-i18n="tabImport.organize.title">Organize tabs</h2>
      <form id="tabImportNewGroupForm" class="tab-import-new-group-form" aria-label="Create a Named Group" data-i18n-aria-label="tabImport.organize.newGroupForm">
        <input id="tabImportNewGroupName" type="text" maxlength="40" placeholder="new group name" aria-label="New group name" data-i18n-placeholder="tabImport.organize.newGroupPlaceholder" data-i18n-aria-label="tabImport.organize.newGroupName" />
        <button type="submit" class="tab-import-secondary" data-i18n="tabImport.organize.create">Create</button>
      </form>
      <div id="tabImportOrganizeBoard" class="tab-import-review-board"></div>
      <div class="tab-import-panel-actions">
        <button id="tabImportBackToTabs" type="button" class="tab-import-secondary" data-i18n="tabImport.organize.back">Back to tabs</button>
        <button id="tabImportContinueToReview" type="button" class="tab-import-primary" disabled data-i18n="tabImport.organize.continue">Review import</button>
      </div>
    </section>
    <section class="tab-import-panel" data-step-panel="review" hidden aria-labelledby="tabImportReviewTitle">
      <h2 id="tabImportReviewTitle" class="section-title tab-import-panel-title" data-i18n="tabImport.review.title">Review import</h2>
      <div id="tabImportReviewSummary" class="tab-import-final-summary"></div>
      <p class="tab-import-final-note" data-i18n="tabImport.review.note">Only the first tab wakes. Your source browser and Favorites stay unchanged.</p>
      <div class="tab-import-panel-actions">
        <button id="tabImportBackToOrganize" type="button" class="tab-import-secondary" data-i18n="tabImport.review.back">Back to organize</button>
        <button id="tabImportApplyBtn" type="button" class="tab-import-primary" disabled data-i18n="tabImport.review.apply">Open tabs in Blanc</button>
      </div>
    </section>
  </div>
  <script src="sheet.js"></script>
  <script src="tab-import-open-tabs.js"></script>
  <script src="tab-import-arc.js"></script>
</body>
</html>
