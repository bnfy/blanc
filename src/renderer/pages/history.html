<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:;" />
  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <title data-i18n="pagesNav.history">History</title>
  <link rel="icon" type="image/png" href="icon-sunrise.png" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body class="sheet">
  <div class="page">
    <nav class="page-nav">
      <a href="blanc://settings/" data-i18n="pagesNav.settings">Settings</a>
      <a href="blanc://bookmarks/" data-i18n="pagesNav.bookmarks">Favorites</a>
      <a href="blanc://history/" class="current" data-i18n="pagesNav.history">History</a>
      <a href="blanc://downloads/" data-i18n="pagesNav.downloads">Downloads</a>
    </nav>
    <h1 data-i18n="pagesNav.history">History</h1>
    <div class="history-views" role="group" aria-label="History" data-i18n-aria-label="pagesNav.history">
      <button id="viewVisits" type="button" aria-pressed="true" data-i18n="history.view.visits">Visits</button>
      <button id="viewArchived" type="button" aria-pressed="false" data-i18n="history.view.archived">Archived tabs</button>
    </div>
    <div class="toolbar-row">
      <input id="search" type="text" placeholder="Search history" aria-label="Search history" data-i18n-placeholder="history.search" data-i18n-aria-label="history.search" />
      <button id="clearAll" class="danger" data-i18n="history.clearAll">Clear all</button>
      <button id="clearArchive" class="danger" hidden data-i18n="history.archived.clear">Clear Archive</button>
    </div>
    <div id="list" class="row-list aligned with-icons"></div>
  </div>
  <script src="sheet.js"></script>
  <script src="row-icon.js"></script>
  <script src="history-groups.js"></script>
  <script src="history.js"></script>
</body>
</html>
