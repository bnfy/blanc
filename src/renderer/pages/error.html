<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self';" />
  <title>Page failed to load</title>
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body class="newtab-body">
  <main class="mark">
    <div class="dot"></div>
    <h1 id="errorTitle" class="section-title">This page didn't load</h1>
    <p id="errorUrl" class="section-hint"></p>
    <p id="errorDetail" class="section-hint"></p>
    <dl id="certificateDetails" class="certificate-details" hidden>
      <div id="certificateSubjectRow" hidden>
        <dt>Certificate for</dt>
        <dd id="certificateSubject"></dd>
      </div>
      <div id="certificateIssuerRow" hidden>
        <dt>Issued by</dt>
        <dd id="certificateIssuer"></dd>
      </div>
      <div id="certificateExpiryRow" hidden>
        <dt>Valid until</dt>
        <dd id="certificateExpiry"></dd>
      </div>
    </dl>
    <nav class="newtab-links">
      <a id="retryLink" href="blanc://newtab/">Try again</a>
      <a id="safetyLink" href="blanc://newtab/">New tab</a>
    </nav>
  </main>
  <script src="error.js"></script>
</body>
</html>
