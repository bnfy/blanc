# Runs a Linux build of the Chromium fork on a hosted Ubuntu 24.04 runner
# (Linux L0, docs/superpowers/plans/2026-11-21-linux-fork-l0.md). The build
# travels as the one asset of the unpublished draft release fork-linux-candidate
# (chromium/linux/ship-candidate.sh). Manual only; run with --ref chromium/next
# and the SHA-256 the packager printed. Ubuntu's restriction on unprivileged
# user namespaces stays on: the smoke check fails if it isn't.
name: chromium-linux-candidate

on:
  workflow_dispatch:
    inputs:
      check:
        description: Check to run
        required: false
        type: choice
        default: candidate
        options:
          - candidate
          - smoke
          - frame
          - keys
          - repo-metadata
      arch:
        description: Candidate architecture for the keys check
        required: false
        type: choice
        default: x64
        options:
          - x64
          - arm64
      sha256:
        description: Candidate tarball SHA-256, or approved-packages.json SHA-256 for repo-metadata (omit for fixtures only)
        required: false
        type: string
      suite:
        description: Suite to run after the two display checks
        required: true
        type: choice
        default: none
        options:
          - none
          - f0
      only:
        description: Optional case-id text for a development subset of f0
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  candidate:
    name: candidate (linux x64)
    if: ${{ inputs.check != 'keys' && inputs.check != 'repo-metadata' && (inputs.check != 'frame' || inputs.suite == 'f0') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Reading the unpublished draft requires write access. Only the download
    # step receives GH_TOKEN, and only the test results become an artifact.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env: &candidate-env
      CANDIDATE_SHA256: ${{ inputs.sha256 }}
      SUITE: ${{ inputs.suite }}
      ONLY: ${{ inputs.only }}
      DRAFT_TAG: fork-linux-candidate
    steps:
      - &validate
        name: Validate inputs
        env:
          LC_ALL: C
        run: |
          only_pattern='^[A-Za-z0-9 _.,:@-]{0,600}$'
          [[ $CANDIDATE_SHA256 =~ ^[0-9a-f]{64}$ ]] || { echo 'sha256 must be 64 lowercase hex digits.' >&2; exit 1; }
          [[ $SUITE == none || $SUITE == f0 ]] || { echo 'suite must be none or f0.' >&2; exit 1; }
          [[ $ONLY =~ $only_pattern ]] || { echo 'only holds unsupported characters or exceeds 600 characters.' >&2; exit 1; }
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - &pins
        name: Fetch the pinned shipping commits
        run: |
          commits=$(node chromium/windows/pinned-commits.mjs)
          while IFS= read -r commit; do
            [[ $commit =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full shipping commit.' >&2; exit 1; }
            git fetch --quiet --depth=1 origin "$commit"
            git cat-file -e "$commit:package.json"
          done <<< "$commits"
          node --input-type=module -e "import { ASSET_NAME } from './chromium/linux/candidate.mjs'; console.log('ASSET=' + ASSET_NAME)" >> "$GITHUB_ENV"
      - &download
        name: Download the candidate from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [[ $draft == true ]] || { echo "$DRAFT_TAG must be an unpublished draft." >&2; exit 1; }
          mkdir "$RUNNER_TEMP/candidate"
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/candidate"
      - &unpack
        name: Verify and unpack the candidate
        run: |
          archive="$RUNNER_TEMP/candidate/$ASSET"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/blanc" "$RUNNER_TEMP/results"
          tar --extract --gzip --no-same-owner --file "$archive" --directory "$RUNNER_TEMP/blanc"
          test -f "$RUNNER_TEMP/blanc/candidate.json"
          echo "CANDIDATE_DIR=$RUNNER_TEMP/blanc" >> "$GITHUB_ENV"
          echo "RESULTS=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
      - &sandbox
        name: Set up the candidate's sandbox helper
        run: |
          helper="$CANDIDATE_DIR/chrome-sandbox"
          [[ -f $helper && ! -L $helper ]]
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Install Xvfb and Weston
        run: |
          # Leave the runners' default mirror first, as every workflow does
          # (scripts/ci-apt-mirror.sh; test/unit/ci-apt-mirror.test.js).
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update
          sudo apt-get install -y xvfb weston
      - &dependencies
        name: Install the harness's dependencies
        id: dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      - name: X11 launch check
        run: xvfb-run -a node chromium/tests/linux-smoke.mjs --display=x11 "$CANDIDATE_DIR" "$RESULTS"
      - name: Wayland launch check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          WAYLAND_DISPLAY: wayland-blanc
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/weston-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RESULTS/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true' EXIT
          timeout 10s bash <<'WAIT_FOR_SOCKET'
          until [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; do sleep 0.1; done
          WAIT_FOR_SOCKET
          node chromium/tests/linux-smoke.mjs --display=wayland "$CANDIDATE_DIR" "$RESULTS"
      - name: Foundation suite
        if: ${{ inputs.suite == 'f0' }}
        run: |
          args=(chromium/linux/run-suite.mjs "$CANDIDATE_DIR" "$RESULTS/f0" --slice=f0)
          if [[ -n $ONLY ]]; then
            # A filter that matches no case would end green having run nothing.
            # Matching is the runner's: any comma-separated text inside a case id.
            # Keep the JavaScript template literal inside the Node process.
            # shellcheck disable=SC2016
            node -e '
              const only = process.argv[1].split(",").filter(Boolean);
              const inventory = require("./chromium/scenarios/inventory.json");
              const ids = inventory.scenarios.flatMap(scenario => scenario.cases.map(c => c.id));
              const unmatched = only.filter(text => !ids.some(id => id.includes(text)));
              if (!only.length || unmatched.length) {
                console.error(`No suite case matches: ${unmatched.length ? unmatched.join(", ") : process.argv[1]}`);
                process.exit(1);
              }' "$ONLY"
            args+=("--only=$ONLY")
          fi
          xvfb-run -a --server-args='-screen 0 1920x1080x24' node "${args[@]}"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-linux-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 14

  frame:
    if: ${{ inputs.check == 'frame' }}
    name: frame (linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env: *candidate-env
    steps:
      - *validate
      - *checkout
      - *node
      - *pins
      - *download
      - *unpack
      - *sandbox
      - name: Install the display servers, Openbox and real input tools
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update
          sudo apt-get install -y xvfb xauth openbox xdotool x11-utils weston libgtk-3-bin gsettings-desktop-schemas
      - *dependencies
      - name: X11 frame input
        run: |
          xvfb-run -a --server-args='-screen 0 3200x2000x24' bash <<'X11'
          set -euo pipefail
          openbox --sm-disable > "$RESULTS/openbox.log" 2>&1 &
          wm=$!
          trap 'kill "$wm" 2>/dev/null || true; wait "$wm" 2>/dev/null || true' EXIT
          timeout 15s bash -c 'until xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; do sleep 0.1; done'
          node chromium/tests/linux-frame.mjs --display=x11 "$CANDIDATE_DIR" "$RESULTS"
          X11
      - name: Wayland frame layout
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          WAYLAND_DISPLAY: wayland-blanc
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/frame-weston"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          # --debug allows weston-screenshooter to read this private, headless output.
          weston --no-config --backend=headless --use-pixman --width=2800 --height=1600 --debug \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RESULTS/frame-weston.log" &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true; wait "$compositor" 2>/dev/null || true' EXIT
          timeout 15s bash <<'WAIT_FOR_SOCKET'
          until [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; do sleep 0.1; done
          WAIT_FOR_SOCKET
          node chromium/tests/linux-frame.mjs --display=wayland "$CANDIDATE_DIR" "$RESULTS"
      - name: Keep the frame evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-linux-frame-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 14

  keys:
    if: ${{ inputs.check == 'keys' }}
    name: keys (linux ${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: write
    env: *candidate-env
    steps:
      - *validate
      - *checkout
      - *node
      - *pins
      - name: Select the packaged candidate for this architecture
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          [[ $ARCH == x64 || $ARCH == arm64 ]]
          echo "ASSET=blanc-linux-$ARCH-candidate.tar.gz" >> "$GITHUB_ENV"
          echo "APPROVAL=signed-candidate-$ARCH.json" >> "$GITHUB_ENV"
      - name: Check the keys archive and repository key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/keys-assets" || {
            echo "Could not read $DRAFT_TAG to check for candidate archive $ASSET." >&2; exit 1;
          }
          missing=0
          if ! grep -Fxq -- "$ASSET" "$RUNNER_TEMP/keys-assets"; then
            echo "Missing candidate archive $ASSET on $DRAFT_TAG. Build and upload this architecture first." >&2
            missing=1
          fi
          if [[ ! -s chromium/linux/keys/blanc-repository.asc ]]; then
            echo "Missing chromium/linux/keys/blanc-repository.asc. The keys check needs a packaged candidate built after the owner's repository key is committed." >&2
            missing=1
          fi
          exit "$missing"
      - *download
      - *unpack
      - name: Check the Debian package and signed approval
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          deb_arch=$ARCH
          if [[ $ARCH == x64 ]]; then deb_arch=amd64; fi
          shopt -s nullglob
          debs=("$CANDIDATE_DIR"/packages/blanc-prototype_*-1_"$deb_arch".deb)
          [[ ${#debs[@]} == 1 && -f ${debs[0]} ]] || {
            echo "$ASSET must contain one packages/blanc-prototype_*-1_$deb_arch.deb. Rebuild with the owner's committed repository key." >&2; exit 1;
          }
          for name in "$APPROVAL" "$APPROVAL.asc"; do
            grep -Fxq -- "$name" "$RUNNER_TEMP/keys-assets" || {
              echo "Missing signed package approval asset $name on $DRAFT_TAG for $ASSET." >&2; exit 1;
            }
          done
      - name: Download the signed package approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DRAFT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP" \
            --pattern "$APPROVAL" --pattern "$APPROVAL.asc"
      - name: Verify and install the approved preview
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/keys-gpg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --dearmor --output "$GNUPGHOME/public.gpg" chromium/linux/keys/blanc-repository.asc
          approval="$RUNNER_TEMP/$APPROVAL"
          gpgv --keyring "$GNUPGHOME/public.gpg" "$approval.asc" "$approval"
          metadata="$CANDIDATE_DIR/candidate.json"
          jq -e --arg sha "$CANDIDATE_SHA256" --arg arch "$ARCH" --slurpfile m "$metadata" '
            .tarSha256 == $sha and .arch == $arch and .arch == $m[0].arch and
            .candidate == $m[0].id and (.deb.sha256 | test("^[0-9a-f]{64}$"))
          ' "$approval"
          file=$(jq -er .deb.file "$approval")
          name=${file#packages/}
          [[ $name =~ ^blanc-prototype_[0-9.]+-1_(amd64|arm64)\.deb$ ]]
          deb="$CANDIDATE_DIR/packages/$name"
          [[ -f $deb ]] || { echo "Missing approved Debian package packages/$name in $ASSET." >&2; exit 1; }
          printf '%s  %s\n' "$(jq -er .deb.sha256 "$approval")" "$deb" | sha256sum --check --strict
          [[ $(dpkg-deb -f "$deb" Package) == blanc-prototype ]]
          [[ $(dpkg-deb -f "$deb" Architecture) == "$(dpkg --print-architecture)" ]]
          # The installer stages chrome.stripped. Bind each launch to the
          # executable in the approved deb, which can differ from the tar's chrome.
          set -o pipefail
          exe_sha=$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - ./opt/bnfy/blanc-prototype/chrome | sha256sum | cut -d' ' -f1)
          if [[ $ARCH == x64 ]]; then bash scripts/ci-apt-mirror.sh; fi
          sudo apt-get update
          sudo apt-get install -y "$deb" xvfb xauth openbox xdotool x11-utils
          jq -e --arg dir '/opt/bnfy/blanc-prototype' --arg exe "$exe_sha" '
            select(.id == ("linux-" + .arch + "-" + .exeSha256[:16])) |
            {candidate:.id, executable:($dir + "/chrome"), executableSha256:$exe,
             singleBinary:true, diskAssets:false, blockerAssets:($dir + "/blanc_blocker")}
          ' "$metadata" > "$RUNNER_TEMP/keys-config.json"
      - *dependencies
      - name: Posted and real Ctrl+Tab gestures on X11
        run: |
          xvfb-run -a --server-args='-screen 0 1920x1080x24' bash <<'X11'
          set -euo pipefail
          unset WAYLAND_DISPLAY
          export GDK_BACKEND=x11
          # Leave Ctrl+Escape to the browser instead of Openbox's window menu.
          echo '<openbox_config xmlns="http://openbox.org/3.4/rc"><keyboard/></openbox_config>' > "$RUNNER_TEMP/keys-wm.xml"
          openbox --sm-disable --config-file "$RUNNER_TEMP/keys-wm.xml" > "$RESULTS/openbox.log" 2>&1 &
          wm=$!
          trap 'kill "$wm" 2>/dev/null || true; wait "$wm" 2>/dev/null || true' EXIT
          timeout 15s bash -c 'until xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; do sleep 0.1; done'
          result=0
          node chromium/tests/native-tab-switch.mjs "$RUNNER_TEMP/keys-config.json" "$RESULTS/posted" || result=1
          node chromium/tests/linux-tab-switch-keys.mjs "$RUNNER_TEMP/keys-config.json" "$RESULTS/real" || result=1
          exit "$result"
          X11
      - name: Keep the key results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-linux-keys-${{ inputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 14

  repo-metadata:
    if: ${{ inputs.check == 'repo-metadata' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # As in the candidate job, needed to read the private draft.
      contents: write
    env:
      APPROVAL_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install repository tools
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c dnf rpm gnupg dpkg-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/repo-verify"
          "$RUNNER_TEMP/repo-verify/bin/pip" install --only-binary=:all: --no-deps rpmrepo-metadata==0.9.1
          echo "$RUNNER_TEMP/repo-verify/bin" >> "$GITHUB_PATH"
      - name: Exercise signed repositories with apt and dnf
        env:
          BLANC_REQUIRE_REPO_TOOLS: '1'
        run: node --test chromium/tools/linux-repository.test.mjs chromium/linux/repository/worker/worker.test.mjs
      - name: Download the approved packages from the candidate draft
        if: ${{ inputs.sha256 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $APPROVAL_SHA256 =~ ^[0-9a-f]{64}$ ]]
          tag=fork-linux-candidate
          [[ $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) == true ]]
          dest="$RUNNER_TEMP/approved"
          mkdir -m 700 "$dest" "$RUNNER_TEMP/repo-gpg"
          export GNUPGHOME="$RUNNER_TEMP/repo-gpg"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dest" --pattern 'approved-packages.json*'
          printf '%s  %s\n' "$APPROVAL_SHA256" "$dest/approved-packages.json" | sha256sum --check --strict
          gpg --batch --dearmor --output "$GNUPGHOME/public.gpg" chromium/linux/keys/blanc-repository.asc
          gpgv --keyring "$GNUPGHOME/public.gpg" "$dest/approved-packages.json.asc" "$dest/approved-packages.json"
          python3 chromium/linux/repository/metadata.py names "$dest" > "$RUNNER_TEMP/package-names"
          while IFS= read -r name; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dest" --pattern "$name"
          done < "$RUNNER_TEMP/package-names"
      - name: Build the unsigned release tree
        if: ${{ inputs.sha256 != '' }}
        run: chromium/linux/repository/build-metadata.sh "$RUNNER_TEMP/approved" "$RUNNER_TEMP/unsigned-tree"
      - name: Return the indexes and inventory to the owner
        if: ${{ inputs.sha256 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-repo-metadata-${{ inputs.sha256 }}
          path: |
            ${{ runner.temp }}/unsigned-tree/tree.json
            ${{ runner.temp }}/unsigned-tree/deb/dists/stable
            ${{ runner.temp }}/unsigned-tree/rpm/stable/x86_64/repodata
            ${{ runner.temp }}/unsigned-tree/rpm/stable/aarch64/repodata
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
