name: Parity guards

# Enforces the cross-platform parity substrate (see spec/shared-substrate.md):
# the design tokens, settings schema, and copy catalog each have a single source
# of truth (tokens/, settings-schema/, copy/) that the desktop code must not drift
# from, and the shared acceptance scenarios (spec/acceptance/) must stay wired to
# their desktop step definitions. These are read-only checks — no build, no publish.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  substrate:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Website claim guards verify evidence against immutable public tags.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: tokens / settings / copy / adblock match their sources
        # Drift guards — the build.mjs checkers use only node builtins,
        # no dependency install needed for this step.
        run: |
          node tokens/build.mjs --check
          node settings-schema/build.mjs --check
          node copy/build.mjs --check
          node adblock/build.mjs --check
      - name: Enable Chromium user namespaces in this disposable Linux runner
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci
      - name: Dependency compliance artifacts match the lockfiles
        run: npm run compliance:check
      - name: Dependency advisories satisfy the security policy
        run: npm run security:dependencies
      - name: JavaScript correctness checks
        run: npm run lint
      - name: Unit regression tests
        run: npm run test:unit

  acceptance-wiring:
    # The shared Gherkin scenarios must resolve to the desktop step definitions.
    # Dry-run only — no app is launched, so the Electron binary isn't downloaded.
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Enable Chromium user namespaces in this disposable Linux runner
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci
      - name: Acceptance step definitions resolve (dry-run)
        run: npm run test:acceptance:dry

  oauth-compatibility:
    # A deterministic, two-origin OAuth fixture exercises the real Electron
    # popup/tab policies, trusted user activation, opener callback, Chrome
    # identity signals, and FedCM fallback. Cross-platform mapping branches run
    # in the unit job above; live third-party canaries stay opt-in because their
    # UI changes independently of Blanc and would make pull requests flaky.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Enable Chromium user namespaces in this disposable Linux runner
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci
      - name: Google OAuth compatibility contract
        run: xvfb-run -a npm run test:oauth:desktop
      - name: Favorites folder picker layering and interaction regression
        run: xvfb-run -a npm run test:favorites-picker:desktop
      - name: Local-clock dynamic wallpaper regression
        run: xvfb-run -a npm run test:wallpaper:desktop

  modified-link-clicks:
    # Electron can defer WebContents creation for Ctrl/Cmd-click and middle-click.
    # Exercise the native input path on both platforms reported in #468.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Modified link clicks (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-enable-linux-sandbox.sh
          xvfb-run -a npm run test:modified-links:desktop
      - name: Modified link clicks (Windows)
        if: runner.os == 'Windows'
        run: npm run test:modified-links:desktop

  tab-handoff:
    # Separate from deployment/signing: use the real local Workers runtime,
    # synthetic tab metadata, and an isolated Electron profile. No credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/tab-import-worker/package-lock.json
            extensions/blanc-tab-import/package-lock.json
      - name: Enable Chromium user namespaces in this disposable Linux runner
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci
      - run: npm ci --prefix cloudflare/tab-import-worker
      - run: npm ci --prefix extensions/blanc-tab-import
      - name: SQLite-backed one-time handoff and desktop decryption
        run: npm run test:runtime --prefix cloudflare/tab-import-worker
      - name: Sync v1 limits in the local Workers runtime
        run: node test/worker/sync-runtime-smoke.mjs
      - name: Firefox manifest and archive
        run: |
          npm run lint:firefox --prefix extensions/blanc-tab-import
          npm run build:firefox --prefix extensions/blanc-tab-import
      - name: Both import screens coexist in Electron
        run: xvfb-run -a npm run test:tab-handoff
      - name: Closing the last window quits Blanc (Linux path of #368)
        run: xvfb-run -a npm run test:window-close-quit

  workspace-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Workspace preservation and opener families (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-enable-linux-sandbox.sh
          xvfb-run -a npm run test:workspaces:desktop
      - name: Workspace preservation and opener families (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:workspaces:desktop

  browser-shortcuts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser commands and Settings (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-enable-linux-sandbox.sh
          for attempt in 1 2 3 4 5; do
            xvfb-run -a npm run test:browser-shortcuts:desktop || exit $?
          done
      - name: Browser commands and Settings (Windows, five fresh processes)
        if: runner.os == 'Windows'
        run: |
          foreach ($attempt in 1..5) {
            npm run test:browser-shortcuts:desktop
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Browser commands and Settings (macOS)
        if: runner.os == 'macOS'
        run: npm run test:browser-shortcuts:desktop
      - name: Real Chrome Web Store documents (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:web-store
      - name: Real Chrome Web Store documents (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:web-store
      - name: Retain private native command failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-command-failure-${{ runner.os }}
          path: dist/browser-command-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
