name: Release Windows & Linux
run-name: ${{ inputs.mode == 'mac-scan' && 'Mac scan only' || inputs.mode == 'validation' && 'Validate' || 'Release' }} ${{ inputs.mode != 'release' && github.ref_name || inputs.tag }} (${{ inputs.platform }})

# electron-builder's Windows (NSIS) and Linux (AppImage) targets are built
# here rather than locally, since `scripts/release.sh` runs on a macOS dev
# machine. This is dispatched by that script right after it publishes the
# notarized macOS assets enter an authenticated draft, targeting the same
# tag/version, so all platforms stage on one unpublished GitHub release.
# Release assets are immutable; duplicate uploads fail.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release, private Windows/Linux validation, or nonpublishing Mac scan installers"
        required: true
        default: release
        type: choice
        options:
          - release
          - validation
          - mac-scan
      tag:
        description: "Release tag to build and upload to (required in release mode)"
        required: false
      runtime:
        description: "Runtime: official Electron, or castLabs ECS with Widevine (public package)"
        required: false
        default: official
        type: choice
        options:
          - official
          - ecs
      source_sha:
        description: "ECS only: the exact approved source commit; the checkout must resolve to it before building"
        required: false
      ublock_candidate:
        description: "Include uBO in a private candidate (requires completed distribution clearance)"
        required: false
        default: false
        type: boolean
      ecs_candidate:
        description: "Candidate-only native ECS validation, no release or installer upload"
        required: false
        default: false
        type: boolean
      ecs_production:
        description: "Private ECS production-integration qualification (never publishes)"
        required: false
        default: false
        type: boolean
      ecs_windows_lifecycle:
        description: "Private Windows NSIS handoff and real CDM lifecycle qualification"
        required: false
        default: false
        type: boolean
      platform:
        description: "Platform jobs to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux

permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate trusted workflow inputs before use
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          UBLOCK_CANDIDATE: ${{ inputs.ublock_candidate }}
          ECS_CANDIDATE: ${{ inputs.ecs_candidate }}
          ECS_PRODUCTION: ${{ inputs.ecs_production }}
          ECS_WINDOWS_LIFECYCLE: ${{ inputs.ecs_windows_lifecycle }}
          RELEASE_RUNTIME: ${{ inputs.runtime }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_RUNTIME" in official|ecs) ;; *) echo "Unknown release runtime" >&2; exit 1 ;; esac
          # Public ECS packages: release mode uploads to the draft; validation
          # mode builds the same marker-free package as a private artifact.
          if [ "$RELEASE_RUNTIME" = ecs ] && { [ "$UBLOCK_CANDIDATE" = true ] || [ "$ECS_CANDIDATE" = true ] || [ "$ECS_PRODUCTION" = true ] || [ "$ECS_WINDOWS_LIFECYCLE" = true ]; }; then
            echo "The public ECS runtime excludes every candidate/qualification input" >&2
            exit 1
          fi
          if [ "$RELEASE_RUNTIME" = ecs ] && ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "An ECS run must name the exact approved source commit (source_sha)" >&2
            exit 1
          fi
          if [ "$RELEASE_RUNTIME" != ecs ] && [ -n "$SOURCE_SHA" ]; then
            echo "source_sha is only accepted for ECS runs" >&2
            exit 1
          fi
          if [ "$UBLOCK_CANDIDATE" = true ] && [ "$RELEASE_MODE" != validation ]; then
            echo "uBO candidate input requires private validation mode" >&2
            exit 1
          fi
          if [ "$ECS_CANDIDATE" = true ] && { [ "$RELEASE_MODE" != validation ] || [ "$UBLOCK_CANDIDATE" = true ]; }; then
            echo "ECS requires validation mode and excludes unqualified uBO" >&2
            exit 1
          fi
          if [ "$ECS_PRODUCTION" = true ] && { [ "$RELEASE_MODE" != validation ] || [ "$UBLOCK_CANDIDATE" = true ] || [ "$ECS_CANDIDATE" = true ]; }; then
            echo "ECS production integration requires exclusive private validation mode" >&2
            exit 1
          fi
          if [ "$ECS_WINDOWS_LIFECYCLE" = true ] && { [ "$RELEASE_MODE" != validation ] || [ "$ECS_PRODUCTION" != true ] || [ "$RELEASE_PLATFORM" != windows ] || [ "$VALIDATION_REF" != refs/heads/codex/ecs-production-integration ]; }; then
            echo "Windows ECS lifecycle requires the isolated candidate branch and exclusive Windows validation" >&2
            exit 1
          fi
          case "$RELEASE_MODE" in release|validation|mac-scan) ;; *) exit 1 ;; esac
          if [ "$RELEASE_MODE" = mac-scan ] && [ "$RELEASE_RUNTIME" != ecs ]; then
            echo "Mac scan builds require the pinned production ECS runtime" >&2
            exit 1
          fi
          if [ "$RELEASE_MODE" = mac-scan ] && [ "$RELEASE_PLATFORM" != all ]; then
            echo "Mac scan mode builds both Mac architectures and requires platform=all" >&2
            exit 1
          fi
          case "$RELEASE_PLATFORM" in all|windows|linux) ;; *) exit 1 ;; esac
          if [ "$RELEASE_MODE" = release ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
              echo "Release tag must be a version such as v1.17.0" >&2
              exit 1
            }
          elif [ -n "$RELEASE_TAG" ]; then
            echo "Validation mode does not accept a release tag" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.ublock_candidate }}
      - name: Require distribution clearance before building a bundled candidate
        if: ${{ inputs.ublock_candidate }}
        run: node scripts/check-ublock-distribution.cjs --bundled

  windows:
    needs: validate-inputs
    if: ${{ (inputs.mode == 'release' || inputs.mode == 'validation') && !inputs.ecs_candidate && !inputs.ecs_production && (inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    # The ECS build needs the protected EVS account for VMP signing. That
    # environment's required reviewer approves each run; official runs
    # reference no environment.
    environment: ${{ inputs.runtime == 'ecs' && 'ecs-signing' || '' }}
    env:
      RELEASE_RUNTIME: ${{ inputs.runtime == 'ecs' && 'ecs' || 'official' }}
      BLANC_ECS_PACKAGE_ROOT: ${{ inputs.runtime == 'ecs' && format('{0}/dist/win-unpacked', github.workspace) || '' }}
      # Every packaged launch in an ECS run has updates disabled. An empty
      # value is identical to unset (production updater) for official runs.
      BLANC_UPDATE_CHANNEL: ${{ inputs.runtime == 'ecs' && 'ecs-qualification-disabled' || '' }}
    # Release uploads and provenance require these grants. Keep them local
    # to the publishing jobs instead of inherited by future jobs.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The capture runtime lock hashes repository bytes. Windows Git's
      # default CRLF conversion changes those bytes before electron-builder's
      # afterPack verification, so disable it before checkout.
      - name: Preserve repository line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.mode == 'release' && inputs.tag || github.ref }}

      # Before any credential exists: the environment policy controls which
      # workflow ref runs, not which code a tag selects.
      - name: Bind the ECS build to the exact approved source commit
        if: ${{ inputs.runtime == 'ecs' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$SOURCE_SHA" ] || {
            echo "::error::Checkout resolved to $ACTUAL, not the approved source $SOURCE_SHA"
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Chromium user namespaces in this disposable Linux runner
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci

      - name: Require uBlock distribution clearance for public release
        if: ${{ inputs.mode == 'release' || inputs.runtime == 'ecs' }}
        run: npm run ublock:distribution

      - name: Verify managed uBlock inputs and adaptation
        run: npm run ublock:check

      - name: Verify dependency compliance inputs
        run: npm run compliance:check

      - name: Verify 1Password broker loads the pinned SDK
        run: npm run test:onepassword:utility

      - name: Verify tag matches package version
        if: ${{ inputs.mode == 'release' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "$RELEASE_TAG" ] || {
            echo "Tag/version mismatch: $RELEASE_TAG vs package $VERSION" >&2
            exit 1
          }

      - name: Verify Windows app icons
        run: npm run icons:windows:check

      - name: Verify packaged blocker inputs
        run: npm run adblock:check

      - name: Install pinned EVS client for ECS VMP signing
        if: ${{ inputs.runtime == 'ecs' }}
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/evs-venv"
          & "$env:RUNNER_TEMP/evs-venv/Scripts/python.exe" -m pip install castlabs-evs==1.3.2
          if ($LASTEXITCODE -ne 0) { throw 'EVS install failed' }

      - name: Materialize protected EVS credentials without logging their values
        if: ${{ inputs.runtime == 'ecs' }}
        env:
          EVS_CONFIG_JSON: ${{ secrets.EVS_CONFIG_JSON }}
          EVS_CACHE_JSON: ${{ secrets.EVS_CACHE_JSON }}
        run: node scripts/prepare-evs-ci.cjs

      - name: Build Windows installer
        shell: bash
        env:
          BLANC_UBLOCK_INTERNAL_BUILD: ${{ inputs.mode == 'validation' && inputs.ublock_candidate && '1' || '0' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          EXPECTED_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          [ -n "$EXPECTED_WINDOWS_PUBLISHER" ] || {
            echo "::error::WINDOWS_EXPECTED_PUBLISHER must contain the exact Authenticode certificate subject."
            exit 1
          }
          if [ "$RELEASE_RUNTIME" = ecs ]; then
            # Same fail-closed Azure-then-CSC Authenticode selection inside the
            # ECS build, then VMP signing after Authenticode.
            echo "==> Building the public ECS (Widevine) installer"
            BLANC_ECS_RELEASE_PIPELINE=1 node scripts/build-ecs-production.cjs --release --win --x64
          elif [ -n "$AZURE_TENANT_ID" ] &&
             [ -n "$AZURE_CLIENT_ID" ] &&
             [ -n "$AZURE_CLIENT_SECRET" ] &&
             [ -n "$AZURE_ENDPOINT" ] &&
             [ -n "$AZURE_CODE_SIGNING_ACCOUNT" ] &&
             [ -n "$AZURE_CERT_PROFILE" ] &&
             [ -n "$AZURE_PUBLISHER_NAME" ]; then
            echo "==> Signing via Azure Trusted Signing ($AZURE_CODE_SIGNING_ACCOUNT/$AZURE_CERT_PROFILE)"
            npx electron-builder --win --publish never \
              --config.win.azureSignOptions.publisherName="$AZURE_PUBLISHER_NAME" \
              --config.win.azureSignOptions.endpoint="$AZURE_ENDPOINT" \
              --config.win.azureSignOptions.certificateProfileName="$AZURE_CERT_PROFILE" \
              --config.win.azureSignOptions.codeSigningAccountName="$AZURE_CODE_SIGNING_ACCOUNT"
          elif [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ]; then
            echo "==> Signing via CSC_LINK (traditional Authenticode cert)"
            npx electron-builder --win --publish never
          else
            echo "::error::No complete Windows signing method is configured. Public releases never fall back to unsigned artifacts."
            exit 1
          fi

      - name: Verify build artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          for f in "dist/$PRODUCT_NAME-Setup-$VERSION.exe" "dist/$PRODUCT_NAME-Setup-$VERSION.exe.blockmap" "dist/latest.yml"; do
            [ -f "$f" ] || { echo "Expected build artifact missing: $f" >&2; exit 1; }
          done

      - name: Remove EVS credentials after signing
        if: ${{ always() && inputs.runtime == 'ecs' }}
        run: node scripts/prepare-evs-ci.cjs --clean

      - name: Verify ECS release identity, archive pin and uBO record
        if: ${{ inputs.runtime == 'ecs' }}
        run: node scripts/verify-ecs-production-package.cjs --release dist/win-unpacked

      - name: Verify packaged blocker payload
        run: node scripts/verify-packaged-adblock.js dist/win-unpacked/resources/app.asar

      - name: Verify packaged uBlock payload and corresponding-source records
        run: node scripts/verify-packaged-ublock.js dist/win-unpacked/resources/app.asar

      - name: Verify packaged compliance payload
        run: node scripts/verify-packaged-compliance.js dist/win-unpacked/resources

      - name: Verify hardened Electron fuses
        shell: bash
        run: |
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          FUSE_ARGS=(); [ "$RELEASE_RUNTIME" = ecs ] && FUSE_ARGS=(--ecs)
          node scripts/verify-electron-fuses.mjs "${FUSE_ARGS[@]}" "dist/win-unpacked/$PRODUCT_NAME.exe"

      # Build inputs remain pinned to the release tag. After packaging, use
      # the workflow commit's test harness so infrastructure-only fixes can
      # verify an immutable draft without rebuilding its other native assets.
      - name: Load smoke harness from workflow commit
        shell: bash
        env:
          VERIFICATION_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$VERIFICATION_SHA"
          for smoke in packaged-media-smoke.mjs packaged-tab-handoff-protocol-smoke.mjs packaged-workspace-recovery-smoke.mjs support/workspace-fixtures.js; do
            git show "$VERIFICATION_SHA:test/desktop/$smoke" > "test/desktop/$smoke"
          done

      - name: Verify packaged microphone and camera permissions and live tracks
        shell: pwsh
        run: |
          $product = node -p "require('./package.json').productName"
          $env:BLANC_PACKAGED_EXECUTABLE = (Resolve-Path "dist/win-unpacked/$product.exe").Path
          node test/desktop/packaged-media-smoke.mjs

      - name: Verify packaged Workspace quit/restart recovery
        shell: pwsh
        run: |
          $product = node -p "require('./package.json').productName"
          $env:BLANC_PACKAGED_EXECUTABLE = (Resolve-Path "dist/win-unpacked/$product.exe").Path
          node test/desktop/packaged-workspace-recovery-smoke.mjs

      - name: Verify Authenticode signature
        shell: pwsh
        env:
          EXPECTED_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          $version = node -p "require('./package.json').version"
          $product = node -p "require('./package.json').productName"
          $installer = "dist/$product-Setup-$version.exe"
          $application = "dist/win-unpacked/$product.exe"
          foreach ($file in @($installer, $application)) {
            if (-not (Test-Path $file)) { throw "Signed Windows binary missing: $file" }
            $signature = Get-AuthenticodeSignature $file
            Write-Host "$file publisher: $($signature.SignerCertificate.Subject)"
            Write-Host "$file status: $($signature.Status)"
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
              throw "$file is not validly Authenticode-signed."
            }
            # Distinguished-name text is not case-sensitive. Keep the full
            # exact subject comparison, but do not reject the same identity
            # solely because a certificate/provider changes letter casing.
            if ($signature.SignerCertificate.Subject -ne $env:EXPECTED_WINDOWS_PUBLISHER) {
              throw "Unexpected Windows publisher: $($signature.SignerCertificate.Subject)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$file has no trusted Authenticode timestamp."
            }
          }
          $installerSignature = Get-AuthenticodeSignature $installer
          $attestation = [ordered]@{
            schemaVersion = 1
            artifact = [System.IO.Path]::GetFileName($installer)
            sha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
            signed = $true
            status = $installerSignature.Status.ToString()
            publisher = $installerSignature.SignerCertificate.Subject
            signerThumbprint = $installerSignature.SignerCertificate.Thumbprint
            timestampAuthority = $installerSignature.TimeStamperCertificate.Subject
          }
          $attestation | ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist/windows-signature.json

      - name: Verify native update verifier and cached installer gate
        if: ${{ inputs.mode == 'validation' }}
        run: |
          node --test test/unit/windows-update-retry.test.js test/unit/windows-update-trust.test.js
          node test/desktop/windows-update-trust-smoke.cjs

      - name: Verify installed blanc-import protocol and candidate uBO acceptance
        shell: pwsh
        env:
          UBLOCK_CANDIDATE: ${{ inputs.ublock_candidate }}
        run: |
          $version = node -p "require('./package.json').version"
          $product = node -p "require('./package.json').productName"
          $installer = (Resolve-Path "dist/$product-Setup-$version.exe").Path
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent protocol-test install failed with exit code $($install.ExitCode)."
          }
          $programsRoot = Join-Path $env:LOCALAPPDATA 'Programs'
          $installedExecutables = @(
            Get-ChildItem -Path $programsRoot -Filter "$product.exe" -File -Recurse
          )
          if ($installedExecutables.Count -ne 1) {
            throw "Expected one installed $product executable, found $($installedExecutables.Count)."
          }
          $installedExecutable = $installedExecutables[0].FullName
          $installedRoot = Split-Path -Parent $installedExecutable
          $uninstaller = Join-Path $installedRoot "Uninstall $product.exe"
          try {
            if (-not (Test-Path $installedExecutable)) {
              throw "Installed protocol-test executable missing: $installedExecutable"
            }
            $env:BLANC_PACKAGED_EXECUTABLE = $installedExecutable
            npm run test:packaged:tab-handoff-protocol
            if ($LASTEXITCODE -ne 0) {
              throw "Installed blanc-import protocol smoke failed."
            }
            # Public ECS enables uBO through its reviewed runtime record, so the
            # installed provider, scripting policy and restarts are checked too.
            # Public ECS fixtures never follow the public update feed.
            if ($env:RELEASE_RUNTIME -eq 'ecs') { $env:BLANC_UPDATE_CHANNEL = 'ecs-qualification-disabled' }
            if ($env:UBLOCK_CANDIDATE -eq 'true' -or $env:RELEASE_RUNTIME -eq 'ecs') {
              $env:BLANC_PACKAGED_ASAR = Join-Path $installedRoot 'resources/app.asar'
              $env:BLANC_UBLOCK_EVIDENCE = Join-Path $PWD 'dist/ublock-noscript-windows.json'
              npm run test:ublock-noscript:packaged
              if ($LASTEXITCODE -ne 0) {
                throw "Installed uBO no-scripting probe failed."
              }
              $env:BLANC_UBLOCK_EVIDENCE = Join-Path $PWD 'dist/ublock-installed-windows.json'
              npm run test:ublock:installed
              if ($LASTEXITCODE -ne 0) {
                throw "Installed uBO provider and restart acceptance failed."
              }
            }
          } finally {
            if (Test-Path $uninstaller) {
              Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
            }
          }

      - name: Verify public ECS file isolation and protected playback
        if: ${{ inputs.runtime == 'ecs' }}
        shell: pwsh
        env:
          BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
        run: |
          $env:BLANC_PACKAGED_EXECUTABLE = (Resolve-Path dist/win-unpacked/Blanc.exe).Path
          node test/desktop/ecs-production-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ECS isolation smoke failed' }
          node test/desktop/ecs-production-drm-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ECS protected playback failed' }

      - name: Preserve public ECS acceptance evidence
        if: ${{ always() && inputs.runtime == 'ecs' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Blanc-Windows-public-ECS-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            output/ecs-production/*.json
            dist/ublock-noscript-windows.json
            dist/ublock-installed-windows.json

      - name: Verify installed browser registration and uninstall cleanup
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $product = node -p "require('./package.json').productName"
          ./scripts/verify-windows-browser-registration.ps1 `
            -Installer "dist/$product-Setup-$version.exe" `
            -ProductName $product `
            -Version $version `
            -ProgId 'BlancURL'

      # Mandatory regression: it must pass before anything is uploaded to the
      # release or attested.
      - name: Packaged browser and Settings regressions
        shell: pwsh
        run: |
          $env:BLANC_PACKAGED_EXECUTABLE = "$pwd/dist/win-unpacked/Blanc.exe"
          npm run test:packaged:browser-compatibility
          if ($LASTEXITCODE -ne 0) { throw "Packaged browser regression failed." }

      - name: Upload to release
        if: ${{ inputs.mode == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          gh release upload "${{ inputs.tag }}" \
            "dist/$PRODUCT_NAME-Setup-$VERSION.exe" \
            "dist/$PRODUCT_NAME-Setup-$VERSION.exe.blockmap" \
            "dist/windows-signature.json" \
            "dist/latest.yml" \
            --repo "${{ github.repository }}"

      - name: Attest Windows release artifacts
        if: ${{ inputs.mode == 'release' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Blanc-Setup-*.exe
            dist/Blanc-Setup-*.exe.blockmap
            dist/windows-signature.json
            dist/latest.yml

      - name: Preserve Windows candidate uBO evidence
        if: ${{ always() && inputs.mode == 'validation' && inputs.ublock_candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Blanc-Windows-uBO-scripting-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            dist/ublock-noscript-windows.json
            dist/ublock-installed-windows.json

      - name: Upload private signed Windows validation artifact
        if: ${{ inputs.mode == 'validation' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Blanc-Windows-${{ github.run_id }}-validation
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Blanc-Setup-*.exe
            dist/Blanc-Setup-*.exe.blockmap
            dist/windows-signature.json
            dist/latest.yml
            dist/ublock-noscript-windows.json
            dist/ublock-installed-windows.json

  ecs-production-windows:
    needs: validate-inputs
    if: ${{ inputs.mode == 'validation' && inputs.ecs_production && (inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ecs-signing
    permissions:
      contents: read
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Install pinned EVS client
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/evs-venv"
          & "$env:RUNNER_TEMP/evs-venv/Scripts/python.exe" -m pip install castlabs-evs==1.3.2
          if ($LASTEXITCODE -ne 0) { throw 'EVS install failed' }
      - name: Materialize protected credentials without logging their values
        env:
          EVS_CONFIG_JSON: ${{ secrets.EVS_CONFIG_JSON }}
          EVS_CACHE_JSON: ${{ secrets.EVS_CACHE_JSON }}
        run: node scripts/prepare-evs-ci.cjs
      - name: Prepare staging-only updater metadata in the disposable checkout
        if: inputs.ecs_windows_lifecycle
        shell: pwsh
        run: |
          npm version 1.43.0-staging.3 --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { throw 'Private version preparation failed' }
          npm run compliance:build
          if ($LASTEXITCODE -ne 0) { throw 'Private compliance preparation failed' }
      - name: Build private production-integration installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node scripts/build-ecs-production.cjs --win --x64
      - name: Verify final Authenticode signatures after VMP signing
        id: ecs_package_verified
        shell: pwsh
        env:
          EXPECTED_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          if (!$env:EXPECTED_WINDOWS_PUBLISHER) { throw 'Expected publisher is required' }
          $version = node -p "require('./package.json').version"
          foreach ($file in @("dist-ecs/Blanc-Setup-$version.exe", 'dist-ecs/win-unpacked/Blanc.exe')) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -ne $env:EXPECTED_WINDOWS_PUBLISHER) { throw "Invalid final signature: $file" }
          }
      - name: Remove EVS credentials before native tests
        if: always()
        run: node scripts/prepare-evs-ci.cjs --clean
      - name: Verify native browser and local-file isolation
        shell: pwsh
        env:
          BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
        run: |
          $env:BLANC_PACKAGED_EXECUTABLE = (Resolve-Path dist-ecs/win-unpacked/Blanc.exe).Path
          $env:BLANC_ECS_PACKAGE_ROOT = (Resolve-Path dist-ecs/win-unpacked).Path
          $env:BLANC_UBLOCK_EVIDENCE = "$PWD/output/ecs-production/ublock-windows.json"
          node scripts/verify-ecs-production-package.cjs dist-ecs/win-unpacked
          if ($LASTEXITCODE -ne 0) { throw 'Final package verification failed' }
          node test/desktop/packaged-ublock-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'uBO acceptance failed' }
          node test/desktop/ecs-production-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline startup or file access isolation failed' }
          node test/desktop/ecs-production-drm-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Protected playback failed' }
          node test/desktop/packaged-workspace-recovery-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Workspace recovery failed' }
          node test/desktop/packaged-media-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Media permissions failed' }
      - name: Real Windows CDM first-install update and rollback
        if: ${{ !cancelled() && inputs.ecs_windows_lifecycle && steps.ecs_package_verified.outcome == 'success' }}
        shell: pwsh
        env:
          BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
        run: |
          $env:BLANC_PACKAGED_EXECUTABLE = (Resolve-Path dist-ecs/win-unpacked/Blanc.exe).Path
          node test/desktop/ecs-cdm-lifecycle-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows CDM lifecycle failed' }
      - name: Actual production-to-ECS Windows Restart Now handoff
        if: ${{ !cancelled() && inputs.ecs_windows_lifecycle && steps.ecs_package_verified.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
          BLANC_ECS_DISPOSABLE_HOST: '1'
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'ecs-windows-baseline'
          New-Item -ItemType Directory -Path $baseline | Out-Null
          gh release download v1.42.1 --repo $env:GITHUB_REPOSITORY -p Blanc-Setup-1.42.1.exe -p SHA256SUMS -D $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Public baseline download failed' }
          $rows = @(Get-Content (Join-Path $baseline 'SHA256SUMS') | Where-Object { $_ -match '^([a-f0-9]{64})\s+Blanc-Setup-1\.42\.1\.exe$' })
          if ($rows.Count -ne 1) { throw 'Exactly one baseline manifest entry required' }
          $expected = ($rows[0] -split '\s+')[0]
          $installer = Join-Path $baseline 'Blanc-Setup-1.42.1.exe'
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant() -ne $expected) { throw 'Baseline digest mismatch' }
          $version = node -p "require('./package.json').version"
          node test/desktop/ecs-production-updater-windows.mjs $installer (Resolve-Path "dist-ecs/Blanc-Setup-$version.exe").Path (Resolve-Path dist-ecs/win-unpacked).Path $version "$PWD/output/ecs-production/updater-windows.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows NSIS handoff failed' }
      - name: Remove EVS credentials even after failure
        if: always()
        run: node scripts/prepare-evs-ci.cjs --clean
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecs-production-windows-${{ github.run_id }}
          path: output/ecs-production/*.json
          if-no-files-found: error
          retention-days: 3

  ecs-production-linux:
    needs: validate-inputs
    if: ${{ inputs.mode == 'validation' && inputs.ecs_production && (inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci
      - name: Verify production profile selection and preload isolation
        run: node --test test/unit/ecs-linux-launcher.test.js
      - name: Build private production-integration AppImage
        run: node scripts/build-ecs-production.cjs --linux --x64
      - name: Verify native browser and local-file isolation
        env:
          BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export BLANC_PACKAGED_EXECUTABLE="$PWD/dist-ecs/Blanc-$(node -p 'require("./package.json").version').AppImage"
          export BLANC_ECS_PACKAGE_ROOT="$PWD/dist-ecs/linux-unpacked"
          export BLANC_UBLOCK_EVIDENCE="$PWD/output/ecs-production/ublock-linux.json"
          node scripts/verify-ecs-production-package.cjs dist-ecs/linux-unpacked
          dbus-run-session -- xvfb-run -a node test/desktop/packaged-ublock-acceptance.mjs
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-production-smoke.mjs
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-production-drm-smoke.mjs
          dbus-run-session -- xvfb-run -a node test/desktop/packaged-workspace-recovery-smoke.mjs
          dbus-run-session -- xvfb-run -a node test/desktop/packaged-media-smoke.mjs
      - name: Real CDM lifecycle and first-install restart
        env:
          BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export BLANC_PACKAGED_EXECUTABLE="$PWD/dist-ecs/Blanc-$(node -p 'require("./package.json").version').AppImage"
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-cdm-lifecycle.mjs
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-production-smoke.mjs
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecs-production-linux-${{ github.run_id }}
          path: |
            output/ecs-production/*.json
            output/playwright/cdm-*.png
          if-no-files-found: error
          retention-days: 3

  linux:
    needs: validate-inputs
    if: ${{ !inputs.ecs_candidate && !inputs.ecs_production && (inputs.mode == 'release' || inputs.mode == 'validation') && (inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_RUNTIME: ${{ inputs.runtime == 'ecs' && 'ecs' || 'official' }}
      # Read by the workspace smoke: an ECS package reports its pinned ECS
      # Electron version. Empty (the official path) for official builds.
      BLANC_ECS_PACKAGE_ROOT: ${{ inputs.runtime == 'ecs' && format('{0}/dist/linux-unpacked', github.workspace) || '' }}
      # Every packaged launch in an ECS run has updates disabled. An empty
      # value is identical to unset (production updater) for official runs.
      BLANC_UPDATE_CHANNEL: ${{ inputs.runtime == 'ecs' && 'ecs-qualification-disabled' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.mode == 'release' && inputs.tag || github.ref }}

      - name: Bind the ECS build to the exact approved source commit
        if: ${{ inputs.runtime == 'ecs' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$SOURCE_SHA" ] || {
            echo "::error::Checkout resolved to $ACTUAL, not the approved source $SOURCE_SHA"
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Chromium user namespaces in this disposable Linux runner
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci

      - name: Verify dependency compliance inputs
        run: npm run compliance:check

      - name: Verify 1Password broker loads the pinned SDK
        run: xvfb-run -a npm run test:onepassword:utility

      - name: Verify managed uBlock inputs and adaptation
        run: npm run ublock:check

      - name: Require uBlock distribution clearance for public release
        if: ${{ inputs.mode == 'release' || inputs.runtime == 'ecs' }}
        run: npm run ublock:distribution

      - name: Verify tag matches package version
        if: ${{ inputs.mode == 'release' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "$RELEASE_TAG" ] || {
            echo "Tag/version mismatch: $RELEASE_TAG vs package $VERSION" >&2
            exit 1
          }

      - name: Build
        env:
          BLANC_UBLOCK_INTERNAL_BUILD: ${{ inputs.mode == 'validation' && inputs.ublock_candidate && '1' || '0' }}
        run: |
          if [ "$RELEASE_RUNTIME" = ecs ]; then
            BLANC_ECS_RELEASE_PIPELINE=1 node scripts/build-ecs-production.cjs --release --linux --x64
          else
            npx electron-builder --linux --publish never
          fi

      - name: Verify ECS release identity, archive pin, native patch and uBO record
        if: ${{ inputs.runtime == 'ecs' }}
        run: node scripts/verify-ecs-production-package.cjs --release dist/linux-unpacked

      - name: Verify build artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          # No separate .blockmap here: for AppImage, electron-builder embeds
          # the block map inside the AppImage itself (mac/win emit separate files).
          for f in "dist/$PRODUCT_NAME-$VERSION.AppImage" "dist/latest-linux.yml"; do
            [ -f "$f" ] || { echo "Expected build artifact missing: $f" >&2; exit 1; }
          done

      - name: Verify packaged desktop browser registration
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          APPIMAGE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage"
          EXTRACT_DIR="$RUNNER_TEMP/blanc-appimage-registration"
          mkdir -p "$EXTRACT_DIR"
          chmod +x "$APPIMAGE"
          cd "$EXTRACT_DIR"
          "$APPIMAGE" --appimage-extract >/dev/null
          DESKTOP_ENTRY=$(find squashfs-root -type f -name '*.desktop' -print -quit)
          [ -n "$DESKTOP_ENTRY" ] || { echo "AppImage desktop entry missing" >&2; exit 1; }
          node "$GITHUB_WORKSPACE/scripts/verify-linux-desktop-entry.js" "$DESKTOP_ENTRY"

      - name: Verify packaged blocker payload
        run: node scripts/verify-packaged-adblock.js dist/linux-unpacked/resources/app.asar

      - name: Verify packaged uBlock payload and corresponding-source records
        run: node scripts/verify-packaged-ublock.js dist/linux-unpacked/resources/app.asar

      - name: Verify packaged compliance payload
        run: node scripts/verify-packaged-compliance.js dist/linux-unpacked/resources

      - name: Verify hardened Electron fuses
        run: |
          EXECUTABLE=$(node -p "require('./package.json').build.executableName || require('./package.json').name")
          FUSE_ARGS=(); [ "$RELEASE_RUNTIME" = ecs ] && FUSE_ARGS=(--ecs)
          node scripts/verify-electron-fuses.mjs "${FUSE_ARGS[@]}" "dist/linux-unpacked/$EXECUTABLE"

      - name: Install AppImage smoke runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 desktop-file-utils xdg-utils xvfb
          TOOLSET=$(node -p "require('./package.json').build.toolsets?.appimage || '0.0.0'")
          if [ "$TOOLSET" = "0.0.0" ]; then
            # Retain support for immutable release tags using the old runtime.
            sudo apt-get install --yes libfuse2
          else
            # The hosted image may already include FUSE 2. Remove it so the
            # actual AppImage launch tests cannot pass through that dependency.
            for package in libfuse2 libfuse2t64; do
              if dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null | grep -qx installed; then
                sudo apt-get remove --yes "$package"
              fi
            done
            if ldconfig -p | grep 'libfuse\.so\.2'; then
              echo "FUSE 2 remains available; dependency-free validation is invalid" >&2
              exit 1
            fi
          fi

      - name: Verify AppImage updater metadata and embedded blockmap
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { inflateRawSync } = require('node:zlib');
          const { load } = require('js-yaml');
          const pkg = require('./package.json');
          const name = `${pkg.productName}-${pkg.version}.AppImage`;
          const image = fs.readFileSync(`dist/${name}`);
          const metadata = load(fs.readFileSync('dist/latest-linux.yml', 'utf8'));
          assert.equal(metadata.version, pkg.version);
          assert.equal(metadata.path, name);
          assert.equal(metadata.files.length, 1);
          const file = metadata.files[0];
          assert.equal(file.url, name);
          assert.equal(file.size, image.length);
          const digest = crypto.createHash('sha512').update(image).digest('base64');
          assert.equal(file.sha512, digest);
          assert.equal(metadata.sha512, digest);
          const size = image.readUInt32BE(image.length - 4);
          assert.ok(size > 0 && size < image.length - 4);
          assert.equal(file.blockMapSize, size);
          const blockmap = JSON.parse(inflateRawSync(image.subarray(image.length - 4 - size, image.length - 4)));
          assert.equal(blockmap.version, '2');
          assert.ok(blockmap.files.length > 0);
          let end = 0;
          for (const entry of blockmap.files) {
            assert.equal(entry.checksums.length, entry.sizes.length);
            assert.equal(entry.offset, end);
            for (const length of entry.sizes) {
              assert.ok(Number.isSafeInteger(length) && length > 0);
              end += length;
            }
          }
          assert.equal(end, image.length - 4 - size);
          console.log(`AppImage updater metadata and embedded blockmap verified: ${name}`);
          NODE

      - name: Verify direct AppImage launch and relaunch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          APPIMAGE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage"
          node scripts/smoke-public-appimage.mjs "$APPIMAGE" "$VERSION"
          node scripts/smoke-public-appimage.mjs "$APPIMAGE" "$VERSION"

      # Build inputs remain pinned to the release tag. After packaging, use
      # the workflow commit's test harness so infrastructure-only fixes can
      # verify an immutable draft without rebuilding its other native assets.
      - name: Load smoke harness from workflow commit
        shell: bash
        env:
          VERIFICATION_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$VERIFICATION_SHA"
          for smoke in packaged-media-smoke.mjs packaged-tab-handoff-protocol-smoke.mjs packaged-tab-view-drawing-smoke.mjs support/fixtures-server.js packaged-workspace-recovery-smoke.mjs support/workspace-fixtures.js; do
            git show "$VERIFICATION_SHA:test/desktop/$smoke" > "test/desktop/$smoke"
          done

      - name: Verify packaged microphone and camera permissions and live tracks
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          BLANC_PACKAGED_EXECUTABLE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage" \
            xvfb-run -a node test/desktop/packaged-media-smoke.mjs

      - name: Verify packaged Workspace quit/restart recovery
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          BLANC_PACKAGED_EXECUTABLE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage" \
            xvfb-run -a node test/desktop/packaged-workspace-recovery-smoke.mjs

      # Raw DevTools protocol, not Playwright: Playwright's focus emulation
      # keeps a stuck page drawing (see the smoke's header).
      - name: Verify packaged tab views keep drawing after switching back and waking
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          BLANC_PACKAGED_EXECUTABLE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage" \
            xvfb-run -a node test/desktop/packaged-tab-view-drawing-smoke.mjs

      - name: Verify installed blanc-import protocol
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          BLANC_PACKAGED_EXECUTABLE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage" \
            dbus-run-session -- xvfb-run -a npm run test:packaged:tab-handoff-protocol

      # Public ECS packages enable uBO through the reviewed ECS runtime
      # record, so the installed provider, controls and restarts are checked
      # on the exact package before any upload.
      - name: Verify candidate uBO installed AppImage controls and restart
        if: ${{ (inputs.mode == 'validation' && inputs.ublock_candidate) || inputs.runtime == 'ecs' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          # Public ECS fixtures never follow the public update feed.
          if [ "$RELEASE_RUNTIME" = ecs ]; then export BLANC_UPDATE_CHANNEL=ecs-qualification-disabled; fi
          BLANC_PACKAGED_EXECUTABLE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage" \
            BLANC_UBLOCK_EVIDENCE="$PWD/dist/ublock-installed-linux.json" \
            BLANC_UBLOCK_NATIVE_LOG="$PWD/dist/ublock-installed-linux-native.log" \
            dbus-run-session -- xvfb-run -a npm run test:ublock:installed

      - name: Verify candidate uBO scripting policy from actual AppImage bytes
        if: ${{ inputs.mode == 'validation' && inputs.ublock_candidate }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          APPIMAGE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage"
          UBLOCK_EVIDENCE="$PWD/dist/ublock-noscript-linux.json"
          UBLOCK_PROBE="$PWD/test/desktop/packaged-ublock-noscript.mjs"
          UBLOCK_EXTRACT=$(mktemp -d)
          trap 'rm -rf "$UBLOCK_EXTRACT"' EXIT
          cd "$UBLOCK_EXTRACT"
          "$APPIMAGE" --appimage-extract >/dev/null
          BLANC_PACKAGED_EXECUTABLE="$UBLOCK_EXTRACT/squashfs-root/blanc" \
            BLANC_PACKAGED_ASAR="$UBLOCK_EXTRACT/squashfs-root/resources/app.asar" \
            BLANC_UBLOCK_EVIDENCE="$UBLOCK_EVIDENCE" \
            dbus-run-session -- xvfb-run -a node "$UBLOCK_PROBE"

      - name: Verify public ECS file isolation and protected playback
        if: ${{ inputs.runtime == 'ecs' }}
        env:
          BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          export BLANC_PACKAGED_EXECUTABLE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage"
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-production-smoke.mjs
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-production-drm-smoke.mjs

      - name: Preserve public ECS acceptance evidence
        if: ${{ always() && inputs.runtime == 'ecs' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Blanc-Linux-public-ECS-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            output/ecs-production/*.json
            dist/ublock-installed-linux.json

      # Mandatory regression: it must pass before anything is uploaded to the
      # release or attested. Linux ECS refuses to start without its launcher,
      # so public ECS runs it through the AppImage; the job-level
      # BLANC_ECS_PACKAGE_ROOT makes the smoke expect the pinned ECS version.
      - name: Packaged browser and Settings regressions
        run: |
          if [ "$RELEASE_RUNTIME" = ecs ]; then
            VERSION=$(node -p "require('./package.json').version")
            PRODUCT_NAME=$(node -p "require('./package.json').productName")
            BLANC_PACKAGED_EXECUTABLE="$PWD/dist/$PRODUCT_NAME-$VERSION.AppImage" \
              dbus-run-session -- xvfb-run -a npm run test:packaged:browser-compatibility
          else
            BLANC_PACKAGED_EXECUTABLE="$PWD/dist/linux-unpacked/blanc" \
              xvfb-run -a npm run test:packaged:browser-compatibility
          fi

      # The release upload and attestation happen in linux-legacy-launch, after
      # this exact AppImage has launched on Ubuntu 22.04.
      - name: Hand the AppImage to the Ubuntu 22.04 launch check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Blanc-Linux-${{ github.run_id }}-built
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/Blanc-*.AppImage
            dist/latest-linux.yml

      - name: Preserve Linux candidate scripting-policy evidence
        if: ${{ always() && inputs.mode == 'validation' && inputs.ublock_candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Blanc-Linux-uBO-scripting-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            dist/ublock-noscript-linux.json
            dist/ublock-installed-linux.json
            dist/ublock-installed-linux-native.log

      - name: Upload private Linux validation artifact
        if: ${{ inputs.mode == 'validation' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Blanc-Linux-${{ github.run_id }}-validation
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/Blanc-*.AppImage
            dist/latest-linux.yml
            dist/ublock-noscript-linux.json
            dist/ublock-installed-linux.json

  # Blanc 1.43.0's AppImage didn't start on glibc older than 2.38 (Ubuntu 22.04,
  # Debian 12), and only the hosted smoke after publication found it. The exact
  # AppImage built above must now launch on Ubuntu 22.04 before it is uploaded
  # to the release or attested.
  linux-legacy-launch:
    needs: [validate-inputs, linux]
    if: ${{ !inputs.ecs_candidate && !inputs.ecs_production && (inputs.mode == 'release' || inputs.mode == 'validation') && (inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-22.04
    env:
      BLANC_UPDATE_CHANNEL: ${{ inputs.runtime == 'ecs' && 'ecs-qualification-disabled' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.mode == 'release' && inputs.tag || github.ref }}

      - name: Bind the ECS build to the exact approved source commit
        if: ${{ inputs.runtime == 'ecs' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$SOURCE_SHA" ] || {
            echo "::error::Checkout resolved to $ACTUAL, not the approved source $SOURCE_SHA"
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install AppImage runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2 xvfb

      - name: Download the AppImage built for this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Blanc-Linux-${{ github.run_id }}-built
          path: dist

      - name: Enable Chromium user namespaces in this disposable Linux runner
        run: bash scripts/ci-enable-linux-sandbox.sh

      - name: Launch the built AppImage on Ubuntu 22.04
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          chmod +x "dist/$PRODUCT_NAME-$VERSION.AppImage"
          node scripts/smoke-public-appimage.mjs "dist/$PRODUCT_NAME-$VERSION.AppImage" "$VERSION"

      - name: Upload to release
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRODUCT_NAME=$(node -p "require('./package.json').productName")
          gh release upload "${{ inputs.tag }}" \
            "dist/$PRODUCT_NAME-$VERSION.AppImage" \
            "dist/latest-linux.yml" \
            --repo "${{ github.repository }}"

      - name: Attest Linux release artifacts
        if: ${{ inputs.mode == 'release' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Blanc-*.AppImage
            dist/latest-linux.yml

  linux-sandbox:
    needs: validate-inputs
    if: ${{ !inputs.ecs_candidate && !inputs.ecs_production && inputs.runtime != 'ecs' && inputs.mode == 'validation' && (inputs.platform == 'all' || inputs.platform == 'linux') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install disposable desktop test environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 desktop-file-utils xdg-utils xvfb libgtk-3-bin
      - name: Build private AppImage without publishing
        env:
          BLANC_UBLOCK_INTERNAL_BUILD: ${{ inputs.ublock_candidate && '1' || '0' }}
        run: npx electron-builder --linux --publish never
      - name: Extract private candidate
        run: |
          IMAGE="$PWD/dist/Blanc-$(node -p "require('./package.json').version").AppImage"
          "$IMAGE" --appimage-extract >/dev/null
          node scripts/verify-linux-desktop-entry.js squashfs-root/blanc.desktop
      - name: Refusal, real launcher paths, namespace and seccomp evidence
        env:
          BLANC_UBLOCK_SANDBOX_CANDIDATE: ${{ inputs.ublock_candidate && '1' || '0' }}
        run: |
          IMAGE="$PWD/dist/Blanc-$(node -p "require('./package.json').version").AppImage"
          dbus-run-session -- xvfb-run -a node scripts/verify-linux-sandbox-candidate.mjs "$IMAGE" "$PWD/squashfs-root/blanc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sandbox-evidence-${{ matrix.os }}-${{ github.run_id }}
          path: sandbox-evidence/*.json
          retention-days: 14

  ecs-native:
    needs: validate-inputs
    if: ${{ inputs.mode == 'validation' && inputs.ecs_candidate }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'linux' && '["ubuntu-latest"]' || '["windows-latest","ubuntu-latest","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      BLANC_ECS_BUILD_RESULT: ${{ github.workspace }}/output/ecs-build.json
    steps:
      - name: Preserve verified source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Candidate unit and input guards
        shell: bash
        run: |
          mkdir -p output
          node --test test/unit/drm-runtime.test.js test/unit/ecs-drm-startup.test.js test/unit/ecs-local-html.test.js test/unit/full-ecs-candidate.test.js test/unit/ecs-updater-policy.test.js test/unit/ecs-cdm-dispatch.test.js test/unit/ecs-bootstrap-sandbox.test.js test/unit/ecs-linux-probe.test.js test/unit/ecs-linux-cdm-zygote-trial.test.js test/unit/ecs-linux-preload-env.test.js test/unit/ecs-linux-launcher.test.js test/unit/ecs-appimage-relaunch.test.js
          npm run adblock:check
          npm run compliance:check
      - name: Enable Linux sandbox on this disposable runner
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - name: Build pinned native ECS candidate, never publish
        id: ecs-build
        env:
          BLANC_ECS_CDM_ZYGOTE_TRIAL: ${{ runner.os == 'Linux' && '1' || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_ENDPOINT: ${{ runner.os == 'Windows' && vars.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ runner.os == 'Windows' && vars.AZURE_CODE_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_CERT_PROFILE: ${{ runner.os == 'Windows' && vars.AZURE_CERTIFICATE_PROFILE_NAME || '' }}
          AZURE_PUBLISHER_NAME: ${{ runner.os == 'Windows' && vars.AZURE_PUBLISHER_NAME || '' }}
        run: node scripts/ecs-native-validation.cjs
      - name: Native startup, restart, profile cleanup and static HTML guard
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a node test/desktop/ecs-native-smoke.cjs
          else
            node test/desktop/ecs-native-smoke.cjs
          fi
      - name: Verify Windows Authenticode and updater trust gates
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          $build = Get-Content $env:BLANC_ECS_BUILD_RESULT | ConvertFrom-Json
          $installer = @(Get-ChildItem "$($build.dist)/*.exe")
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          foreach ($file in @($installer[0].FullName, "$($build.dist)/win-unpacked/Blanc.exe")) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -ne $env:EXPECTED_WINDOWS_PUBLISHER -or -not $signature.TimeStamperCertificate) {
              throw 'Invalid publisher, signature or timestamp'
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $installer[0].FullName dist/
          $evidence = [ordered]@{
            artifact = $installer[0].Name
            sha256 = (Get-FileHash -Algorithm SHA256 $installer[0].FullName).Hash.ToLowerInvariant()
            publisher = $env:EXPECTED_WINDOWS_PUBLISHER
            signed = $true
            timestamped = $true
            vmpSigned = $false
          }
          $evidence | ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist/windows-signature.json
          $evidence | ConvertTo-Json | Set-Content -Encoding utf8NoBOM output/ecs-native/windows-signature.json
          node --test test/unit/windows-update-retry.test.js test/unit/windows-update-trust.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Updater trust unit tests failed' }
          node test/desktop/windows-update-trust-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Updater trust native smoke failed' }
      - name: Linux full local HTML isolation
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ecs-build.outcome == 'success' }}
        shell: bash
        run: |
          APP_DIR=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.BLANC_ECS_BUILD_RESULT)).dist + "/linux-unpacked"')
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-local-html-smoke.cjs "$APP_DIR" output/ecs-native/local-html.json
      - name: Linux protected playback and kernel CDM sandbox
        id: linux-drm
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ecs-build.outcome == 'success' }}
        shell: bash
        run: |
          APP_DIR=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.BLANC_ECS_BUILD_RESULT)).dist + "/linux-unpacked"')
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-drm-playback-smoke.cjs "$APP_DIR" output/ecs-native/drm.json
      - name: Linux fresh and cached offline startup
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ecs-build.outcome == 'success' }}
        shell: bash
        run: |
          APP_DIR=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.BLANC_ECS_BUILD_RESULT)).dist + "/linux-unpacked"')
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-offline-startup-smoke.cjs "$APP_DIR" output/ecs-native/offline.json
      - name: Linux cached update and rollback selection
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ecs-build.outcome == 'success' }}
        run: node test/desktop/ecs-linux-cdm-cache-qualification.cjs output/ecs-native/cdm-cache.json
      - name: Build next isolated Linux updater candidate
        id: ecs-next
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ecs-build.outcome == 'success' }}
        shell: bash
        run: |
          BLANC_ECS_BUILD_RESULT="$GITHUB_WORKSPACE/output/ecs-next-build.json" node scripts/build-next-ecs-candidate.cjs "$GITHUB_WORKSPACE/output/ecs-build.json"
          BLANC_ECS_BUILD_RESULT="$GITHUB_WORKSPACE/output/ecs-third-build.json" node scripts/build-next-ecs-candidate.cjs "$GITHUB_WORKSPACE/output/ecs-build.json" 3
          sudo apt-get update
          sudo apt-get install --yes xdotool
      - name: Linux real staged Restart Now handoff
        timeout-minutes: 6
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ecs-next.outcome == 'success' }}
        shell: bash
        run: |
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-linux-updater-qualification.cjs output/ecs-build.json output/ecs-next-build.json output/ecs-native/updater-handoff.json output/ecs-third-build.json
      - name: Linux final successor local HTML isolation
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ecs-next.outcome == 'success' }}
        shell: bash
        run: |
          APP_DIR=$(node -p 'JSON.parse(require("fs").readFileSync("output/ecs-third-build.json")).dist + "/linux-unpacked"')
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-local-html-smoke.cjs "$APP_DIR" output/ecs-native/successor-local-html.json
      - name: Diagnose aligned native and session profile
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux-drm.outcome == 'failure' }}
        shell: bash
        env:
          BLANC_ECS_SHARED_PROFILE_TRIAL: '1'
        run: |
          APP_DIR=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.BLANC_ECS_BUILD_RESULT)).dist + "/linux-unpacked"')
          dbus-run-session -- xvfb-run -a node test/desktop/ecs-drm-playback-smoke.cjs "$APP_DIR" output/ecs-native/drm-shared-profile.json
      - name: Upload sanitized evidence only, never installers or profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecs-native-evidence-${{ matrix.os }}-${{ github.run_id }}
          path: output/ecs-native/*.json
          if-no-files-found: error
          retention-days: 3

  mac-scan:
    needs: validate-inputs
    if: ${{ inputs.mode == 'mac-scan' && inputs.runtime == 'ecs' }}
    environment: ecs-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app_dir: mac-arm64
          - runner: macos-15-intel
            arch: x64
            app_dir: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET_ARCH: ${{ matrix.arch }}
      APP_DIR: dist/${{ matrix.app_dir }}/Blanc.app
      BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Bind workflow and source to the approved commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix site
      - name: Run the release press gate before signing
        run: npm run release:verify:press
      - name: Install pinned EVS client
        run: |
          python3 -m venv "$RUNNER_TEMP/evs-venv"
          "$RUNNER_TEMP/evs-venv/bin/python" -m pip install castlabs-evs==1.3.2
      - name: Materialize existing protected EVS credentials
        env:
          EVS_CONFIG_JSON: ${{ secrets.EVS_CONFIG_JSON }}
          EVS_CACHE_JSON: ${{ secrets.EVS_CACHE_JSON }}
        run: node scripts/prepare-evs-ci.cjs
      - name: Build production-config signed and notarized installers without publishing
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: XYGUCY4498
          BLANC_ECS_RELEASE_PIPELINE: '1'
        shell: bash
        run: |
          set -euo pipefail
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            test -n "${!key}" || { echo "Missing protected Mac signing credential: $key" >&2; exit 1; }
          done
          node scripts/preflight-mac-signing.mjs
          node scripts/build-ecs-production.cjs --release --mac "--$TARGET_ARCH"
      - name: Verify final signed package and stapled notarization
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-ecs-production-package.cjs --release "$APP_DIR"
          node scripts/verify-electron-fuses.mjs --ecs "$APP_DIR/Contents/MacOS/Blanc"
          node scripts/verify-packaged-ublock.js "$APP_DIR/Contents/Resources/app.asar"
          node scripts/verify-packaged-adblock.js "$APP_DIR/Contents/Resources/app.asar"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          xcrun stapler validate "$APP_DIR"
          spctl --assess --type execute --verbose=2 "$APP_DIR"
      - name: Remove EVS credentials before browser tests
        if: always()
        run: node scripts/prepare-evs-ci.cjs --clean
      - name: Smoke-test the signed packaged first-run experience
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ github.workspace }}/dist/${{ matrix.app_dir }}/Blanc.app/Contents/MacOS/Blanc
        run: npm run test:packaged:first-run
      - name: Record immutable installer digests and candidate source
        id: verified
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/Blanc-*.dmg dist/Blanc-*.zip dist/Blanc-*.blockmap)
          test "${#assets[@]}" -eq 4
          shasum -a 256 "${assets[@]}" > "dist/SHA256SUMS-mac-$TARGET_ARCH"
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          fs.writeFileSync(`dist/mac-candidate-${process.env.TARGET_ARCH}.json`, JSON.stringify({
            sourceSha: process.env.APPROVED_SOURCE_SHA, version: pkg.version,
            bundleVersion: pkg.build.mac.bundleVersion, arch: process.env.TARGET_ARCH,
            runtime: require('./build/ecs-runtime.json').version,
            signedAndNotarized: true, published: false,
          }, null, 2) + '\n');
          NODE
      - name: Upload only installers and verification records for scanning
        if: success() && steps.verified.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-scan-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            dist/Blanc-*.dmg
            dist/Blanc-*.zip
            dist/Blanc-*.blockmap
            dist/SHA256SUMS-mac-*
            dist/mac-candidate-*.json
          if-no-files-found: error
          retention-days: 3
