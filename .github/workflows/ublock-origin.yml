name: Full uBlock Origin candidate
on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/renderer/renderer.js'
      - 'src/renderer/overlay*'
      - 'src/renderer/index.html'
      - 'src/renderer/styles.css'
      - 'src/renderer/pages/settings*'
      - 'src/renderer/ublock-*'
      - 'src/renderer/ublock-popup-icons/**'
      - 'ublock/**'
      - 'test/desktop/ublock*'
      - 'test/desktop/shield-provider*'
      - 'test/desktop/support/**'
      - 'test/unit/ublock*'
      - 'test/unit/blocking*'
      - 'test/unit/shield*'
      - 'scripts/*ublock*'
      - 'scripts/*capture-preload*'
      - 'scripts/verify-packaged-*'
      - 'scripts/generate-compliance*'
      - 'adblock/**'
      - 'compliance/**'
      - '.gitattributes'
      - 'package*.json'
      - '.github/workflows/ublock-origin.yml'
  workflow_dispatch:
    inputs:
      installed_intel:
        description: "Also exercise an unsigned installed Intel package (not signing acceptance)"
        type: boolean
        default: false
      intel_audio:
        description: "Compare official Electron, ECS and native output clocks on disposable Intel"
        type: boolean
        default: false
      ecs_fresh_mac:
        description: "Owner-authorized private fresh signed Mac acceptance and updater rehearsals"
        type: boolean
        default: false
      ecs_fresh_mac_updater_only:
        description: "Rerun only the two fresh signed Mac updater rehearsals"
        type: boolean
        default: false
      ecs_fresh_mac_audio_only:
        description: "Diagnose PCM, AAC, Web Audio and protected playback in the exact signed Mac apps"
        type: boolean
        default: false
      linux_native_diagnostics:
        description: "Capture Linux native stacks from repeated isolated real-blocking fixtures"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ordinary-package:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.installed_intel && !inputs.linux_native_diagnostics && !inputs.intel_audio && !inputs.ecs_fresh_mac) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build ordinary public payload with its production allowlist
        run: npx electron-builder --linux --dir --publish never
      - name: Verify ordinary payload and exclusion boundary
        run: node scripts/verify-packaged-ublock.js dist/linux-unpacked/resources/app.asar
  desktop:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.installed_intel && !inputs.linux_native_diagnostics && !inputs.intel_audio && !inputs.ecs_fresh_mac) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve verified bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Unit evidence checks read immutable release tags and commits.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable native Linux renderer sandbox
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run ublock:check
      - run: npm run lint
      - run: npm run test:unit
      - name: Real blocking, original tools, isolation and lifecycle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:shield-provider:desktop
            xvfb-run -a npm run test:ublock:desktop
            xvfb-run -a npm run test:ublock-dashboard:desktop
            xvfb-run -a npm run test:ublock-retirement:desktop
            xvfb-run -a npm run test:ublock-unavailable:desktop
            xvfb-run -a npm run test:ublock-noscript:desktop
            xvfb-run -a npm run test:ublock-slow-install:desktop
          else
            npm run test:shield-provider:desktop
            npm run test:ublock:desktop
            npm run test:ublock-dashboard:desktop
            npm run test:ublock-retirement:desktop
            npm run test:ublock-unavailable:desktop
            npm run test:ublock-noscript:desktop
            npm run test:ublock-slow-install:desktop
          fi

  intel-audio:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.intel_audio && github.ref == 'refs/heads/codex/ecs-production-integration' }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --foreground-scripts
      - name: Prepare unmodified version-matched audio controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = x86_64
          test "$(node -p 'process.arch')" = x64
          mkdir -p "$RUNNER_TEMP/official-audio"
          gh release download v44.9.3 -R electron/electron -p electron-v44.9.3-darwin-x64.zip -p SHASUMS256.txt -D "$RUNNER_TEMP/official-audio"
          cd "$RUNNER_TEMP/official-audio"
          awk '$2 == "*electron-v44.9.3-darwin-x64.zip" || $2 == "electron-v44.9.3-darwin-x64.zip"' SHASUMS256.txt > expected.sha256
          test "$(wc -l < expected.sha256 | tr -d ' ')" = 1
          shasum -a 256 -c expected.sha256
          ditto -x -k electron-v44.9.3-darwin-x64.zip .
          echo "OFFICIAL_AUDIO_EXECUTABLE=$RUNNER_TEMP/official-audio/Electron.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          node -e 'require("./scripts/prepare-ecs-runtime.cjs").prepareEcsRuntime("darwin","x64").then(r=>require("node:fs").appendFileSync(process.env.GITHUB_ENV,"ECS_AUDIO_EXECUTABLE="+r.directory+"/Electron.app/Contents/MacOS/Electron\n"))'
          swiftc test/desktop/native-audio-clock.swift -o "$RUNNER_TEMP/native-audio-clock"
          echo "NATIVE_AUDIO_PROBE=$RUNNER_TEMP/native-audio-clock" >> "$GITHUB_ENV"
      - name: Compare local PCM media, Web Audio and native CoreAudio
        run: node test/desktop/intel-audio-comparison.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: intel-audio-comparison-${{ github.run_id }}
          path: output/ecs-production/intel-audio-comparison.json
          if-no-files-found: error
          retention-days: 3

  ecs-fresh-mac:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ecs_fresh_mac && github.ref == 'refs/heads/codex/ecs-production-integration' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        mode: ${{ inputs.ecs_fresh_mac_audio_only && fromJSON('["audio"]') || inputs.ecs_fresh_mac_updater_only && fromJSON('["updater"]') || fromJSON('["acceptance", "updater"]') }}
        include:
          - arch: arm64
            os: macos-15
            cpu: arm64
            baseline: Blanc-1.42.1-arm64.dmg
            archive_sha: f8157115c45489dae30be684773b6ec9fd532e8fc6ad384478e1c8f8429b482b
            app_sha: 111ad8adb76ac4c45902bddedd6593410f58376e49d6605a9d8f4d51a0f0ee36
            executable_sha: 88fb243dfc277b035aeced478b2df125a9b0f2853fae7470abbfc53c56e66bb5
            update_sha: 6f1a1778cd5b15e6216365acd1d1dad81eee7e35385bc41d85083a317f6aeafa
            update_asar: 7900995e3f2e4feee2b70324ff699b4d61ca4c62dab46576a36eb06c7e957117
          - arch: x64
            os: macos-15-intel
            cpu: x86_64
            baseline: Blanc-1.42.1.dmg
            archive_sha: af08d30687db5d52bd6931f5b3372194d3e52f08a7adc87111066372fdfc257f
            app_sha: 0a0d7ed5041ccc1134035e36887ab8077cabafefe76ad5ce3306d18c248c01cb
            executable_sha: 5545cf32167daf6cde48cf9ee69fa7aea1cc2245f514db065d0b69d264889378
            update_sha: 4b26a99cbb8532b2be79a41049afc55d8fd2a9f46d8612b6fcb4c0c4395db2a3
            update_asar: 1f832abb111f96c9d11671a8331a9d98fa70b697653d82467f14818bbc32ccc4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Temporary owner-approved draft access, removed after all intake runs.
    # GitHub requires this permission to download an unpublished draft.
    permissions:
      contents: write
    env:
      BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Fetch exact fresh signed packages from the temporary draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = '${{ matrix.cpu }}'
          test "$(node -p 'process.arch')" = '${{ matrix.arch }}'
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || echo 0)" != 1
          test "$(gh release view ecs-private-mac-fd8654147 -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh release view ecs-private-mac-fd8654147 -R "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = fd865414726d703ce07a50594deeb189665efe10
          mkdir -p "$RUNNER_TEMP/ecs-fresh/download" "$RUNNER_TEMP/ecs-fresh/app" "$RUNNER_TEMP/ecs-fresh/target"
          gh release download ecs-private-mac-fd8654147 -R "$GITHUB_REPOSITORY" \
            -p 'Blanc-ECS-${{ matrix.arch }}-fd8654147.zip' \
            -p 'Blanc-ECS-${{ matrix.arch }}-updater.zip' -D "$RUNNER_TEMP/ecs-fresh/download"
          cd "$RUNNER_TEMP/ecs-fresh/download"
          echo '${{ matrix.archive_sha }}  Blanc-ECS-${{ matrix.arch }}-fd8654147.zip' | shasum -a 256 -c -
          echo '${{ matrix.update_sha }}  Blanc-ECS-${{ matrix.arch }}-updater.zip' | shasum -a 256 -c -
          ditto -x -k 'Blanc-ECS-${{ matrix.arch }}-fd8654147.zip' "$RUNNER_TEMP/ecs-fresh/app"
          ditto -x -k 'Blanc-ECS-${{ matrix.arch }}-updater.zip' "$RUNNER_TEMP/ecs-fresh/target"
          echo "BLANC_ECS_PACKAGE_ROOT=$RUNNER_TEMP/ecs-fresh/app/Blanc.app" >> "$GITHUB_ENV"
          echo "BLANC_PACKAGED_EXECUTABLE=$RUNNER_TEMP/ecs-fresh/app/Blanc.app/Contents/MacOS/Blanc" >> "$GITHUB_ENV"
          echo "BLANC_PACKAGED_ASAR=$RUNNER_TEMP/ecs-fresh/app/Blanc.app/Contents/Resources/app.asar" >> "$GITHUB_ENV"
      - name: Verify exact application payload and Apple trust
        run: |
          echo '${{ matrix.app_sha }}  '"$BLANC_ECS_PACKAGE_ROOT/Contents/Resources/app.asar" | shasum -a 256 -c -
          echo '${{ matrix.executable_sha }}  '"$BLANC_PACKAGED_EXECUTABLE" | shasum -a 256 -c -
          echo '${{ matrix.update_asar }}  '"$RUNNER_TEMP/ecs-fresh/target/Blanc.app/Contents/Resources/app.asar" | shasum -a 256 -c -
          for KIND in app target; do
            APP="$RUNNER_TEMP/ecs-fresh/$KIND/Blanc.app"
            test "$(lipo -archs "$APP/Contents/MacOS/Blanc")" = '${{ matrix.cpu }}'
            codesign --verify --deep --strict "$APP"
            if [[ '${{ matrix.arch }}' = x64 ]]; then
              bash scripts/ci-intel-apple-tickets.sh "$APP"
            else
              xcrun stapler validate "$APP"
              spctl --assess --type execute --verbose=4 "$APP"
            fi
          done
          node scripts/verify-ecs-production-package.cjs "$BLANC_ECS_PACKAGE_ROOT"
          node -e 'require("./scripts/after-sign-verify.js")({electronPlatformName:"darwin",appOutDir:process.env.RUNNER_TEMP+"/ecs-fresh/app",packager:{appInfo:{productFilename:"Blanc"}}}).catch(e=>{console.error(e);process.exitCode=1})'
      - name: Native signed-app compatibility and protected playback
        if: matrix.mode == 'acceptance'
        env:
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/output/ecs-production/ublock-fresh.json
        run: |
          node test/desktop/support/installed-mac-native-quit.mjs
          node test/desktop/ecs-production-smoke.mjs
          node test/desktop/ecs-local-html-smoke.cjs "$BLANC_ECS_PACKAGE_ROOT" output/ecs-production/local-html-fresh.json
          node test/desktop/packaged-workspace-recovery-smoke.mjs
          node test/desktop/packaged-media-smoke.mjs
          node test/desktop/ecs-production-drm-smoke.mjs
      - name: Compare audio controls inside the unchanged signed full browser
        if: matrix.mode == 'audio'
        run: |
          swiftc test/desktop/native-audio-clock.swift -o "$RUNNER_TEMP/native-audio-clock"
          NATIVE_AUDIO_PROBE="$RUNNER_TEMP/native-audio-clock" node test/desktop/ecs-signed-audio-controls.mjs
      - name: Fetch the public baseline without modifying any public asset
        if: matrix.mode == 'updater'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ecs-fresh/old" "$RUNNER_TEMP/ecs-fresh/mount"
          gh release download v1.42.1 -R "$GITHUB_REPOSITORY" -p '${{ matrix.baseline }}' -p SHA256SUMS -D "$RUNNER_TEMP/ecs-fresh/download"
          cd "$RUNNER_TEMP/ecs-fresh/download"
          awk '$2 == "${{ matrix.baseline }}"' SHA256SUMS > baseline.sha256
          test "$(wc -l < baseline.sha256 | tr -d ' ')" = 1
          shasum -a 256 -c baseline.sha256
          hdiutil attach '${{ matrix.baseline }}' -mountpoint "$RUNNER_TEMP/ecs-fresh/mount" -readonly -nobrowse
          ditto "$RUNNER_TEMP/ecs-fresh/mount/Blanc.app" "$RUNNER_TEMP/ecs-fresh/old/Blanc.app"
          hdiutil detach "$RUNNER_TEMP/ecs-fresh/mount"
          codesign --verify --deep --strict "$RUNNER_TEMP/ecs-fresh/old/Blanc.app"
          if [[ '${{ matrix.arch }}' = x64 ]]; then
            bash "$GITHUB_WORKSPACE/scripts/ci-intel-apple-tickets.sh" "$RUNNER_TEMP/ecs-fresh/old/Blanc.app"
          else
            xcrun stapler validate "$RUNNER_TEMP/ecs-fresh/old/Blanc.app"
            spctl --assess --type execute --verbose=4 "$RUNNER_TEMP/ecs-fresh/old/Blanc.app"
          fi
      - name: Verify target package metadata then exercise actual Restart Now
        if: matrix.mode == 'updater'
        env:
          BLANC_ECS_DISPOSABLE_HOST: '1'
        run: |
          npm version 1.43.0-staging.2 --no-git-tag-version
          npm run compliance:build
          node scripts/verify-ecs-production-package.cjs "$RUNNER_TEMP/ecs-fresh/target/Blanc.app"
          node -e 'require("./scripts/after-sign-verify.js")({electronPlatformName:"darwin",appOutDir:process.env.RUNNER_TEMP+"/ecs-fresh/target",packager:{appInfo:{productFilename:"Blanc"}}}).catch(e=>{console.error(e);process.exitCode=1})'
          node test/desktop/ecs-production-updater-mac.mjs \
            "$RUNNER_TEMP/ecs-fresh/old/Blanc.app" \
            "$RUNNER_TEMP/ecs-fresh/download/Blanc-ECS-${{ matrix.arch }}-updater.zip" \
            1.43.0-staging.2 '${{ matrix.update_asar }}' \
            "$PWD/output/ecs-production/updater-fresh.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fresh-mac-${{ matrix.arch }}-${{ matrix.mode }}-${{ github.run_id }}
          path: output/ecs-production/*.json
          if-no-files-found: error
          retention-days: 3

  installed-intel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installed_intel }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      # Intel's default is still Xcode 16.4; Blanc's committed Icon Composer
      # inputs require the already-installed Xcode 26 compiler.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run ublock:check
      # No signing credentials leave the owner Mac. This proves native Intel
      # packaged behavior only, and never clears the signed-installed gate.
      - name: Build unsigned private Intel fixture
        env:
          BLANC_UBLOCK_INTERNAL_BUILD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node <<'NODE'
          const { build, Platform, Arch } = require('electron-builder');
          build({ targets: Platform.MAC.createTarget(['dmg'], Arch.x64), publish: 'never',
            config: { mac: { identity: null }, afterSign: null } })
            .catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Install the actual DMG fixture
        run: |
          DMG="$PWD/dist/Blanc-$(node -p "require('./package.json').version").dmg"
          MOUNT="$RUNNER_TEMP/blanc-intel-dmg"
          mkdir -p "$MOUNT" "$RUNNER_TEMP/Applications"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -readonly -nobrowse
          ditto "$MOUNT/Blanc.app" "$RUNNER_TEMP/Applications/Blanc.app"
          hdiutil detach "$MOUNT"
          node scripts/verify-electron-fuses.mjs "$RUNNER_TEMP/Applications/Blanc.app/Contents/MacOS/Blanc"
          node scripts/verify-packaged-ublock.js "$RUNNER_TEMP/Applications/Blanc.app/Contents/Resources/app.asar"
      - name: Native Intel installed controls, persistence, restarts and Quit
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ runner.temp }}/Applications/Blanc.app/Contents/MacOS/Blanc
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/dist/ublock-installed-intel-unsigned.json
        run: node test/desktop/support/installed-mac-native-quit.mjs
      - name: Native Intel installed scripting policy
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ runner.temp }}/Applications/Blanc.app/Contents/MacOS/Blanc
          BLANC_PACKAGED_ASAR: ${{ runner.temp }}/Applications/Blanc.app/Contents/Resources/app.asar
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/dist/ublock-noscript-intel-unsigned.json
        run: npm run test:ublock-noscript:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unsigned-native-intel-observations-${{ github.run_id }}
          path: dist/ublock-*-intel-unsigned.json
          retention-days: 14

  linux-native-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_native_diagnostics }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable native Linux renderer sandbox
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci --no-audit --no-fund
      - name: Prepare official native debugger
        run: |
          command -v gdb || { sudo apt-get update; sudo apt-get install -y gdb; }
          chmod +x test/desktop/support/electron-native-debug.sh
      - name: Capture isolated browser-process native stacks
        shell: bash
        run: |
          mkdir -p dist/native-diagnostics
          export BLANC_UBLOCK_NATIVE_STACK_DIR="$PWD/dist/native-diagnostics"
          export BLANC_UBLOCK_NATIVE_EXECUTABLE="$PWD/node_modules/electron/dist/electron"
          export BLANC_UBLOCK_ELECTRON="$PWD/test/desktop/support/electron-native-debug.sh"
          export BLANC_UBLOCK_RESTORE_STRESS=1
          # Write directly: detached crash-handler children may retain the
          # debugger's output handles after the browser has exited.
          for attempt in 1 2 3; do
            xvfb-run -a npm run test:ublock:desktop > "dist/native-diagnostics/restore-stress-$attempt.log" 2>&1
            tail -n 40 "dist/native-diagnostics/restore-stress-$attempt.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-native-stacks-${{ github.run_id }}
          path: dist/native-diagnostics/*
          retention-days: 3
