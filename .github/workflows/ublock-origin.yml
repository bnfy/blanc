name: Full uBlock Origin candidate
on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/renderer/renderer.js'
      - 'src/renderer/overlay*'
      - 'src/renderer/index.html'
      - 'src/renderer/styles.css'
      - 'src/renderer/pages/settings*'
      - 'src/renderer/ublock-*'
      - 'src/renderer/ublock-popup-icons/**'
      - 'ublock/**'
      - 'test/desktop/ublock*'
      - 'test/desktop/shield-provider*'
      - 'test/desktop/support/**'
      - 'test/unit/ublock*'
      - 'test/unit/blocking*'
      - 'test/unit/shield*'
      - 'scripts/*ublock*'
      - 'scripts/*capture-preload*'
      - 'scripts/verify-packaged-*'
      - 'scripts/generate-compliance*'
      - 'adblock/**'
      - 'compliance/**'
      - '.gitattributes'
      - 'package*.json'
      - '.github/workflows/ublock-origin.yml'
  workflow_dispatch:
    inputs:
      installed_intel:
        description: "Also exercise an unsigned installed Intel package (not signing acceptance)"
        type: boolean
        default: false
      intel_audio:
        description: "Compare official Electron, ECS and native output clocks on disposable Intel"
        type: boolean
        default: false
      ecs_signed_intel:
        description: "Owner-authorized temporary draft intake of the exact signed ECS Intel candidate"
        type: boolean
        default: false
      ecs_intel_updater:
        description: "Owner-authorized signed ECS Intel updater rehearsal on a disposable runner"
        type: boolean
        default: false
      linux_native_diagnostics:
        description: "Capture Linux native stacks from repeated isolated real-blocking fixtures"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ordinary-package:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.installed_intel && !inputs.linux_native_diagnostics && !inputs.ecs_signed_intel && !inputs.ecs_intel_updater && !inputs.intel_audio) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build ordinary public payload with its production allowlist
        run: npx electron-builder --linux --dir --publish never
      - name: Verify ordinary payload and exclusion boundary
        run: node scripts/verify-packaged-ublock.js dist/linux-unpacked/resources/app.asar
  desktop:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.installed_intel && !inputs.linux_native_diagnostics && !inputs.ecs_signed_intel && !inputs.ecs_intel_updater && !inputs.intel_audio) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve verified bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Unit evidence checks read immutable release tags and commits.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable native Linux renderer sandbox
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run ublock:check
      - run: npm run lint
      - run: npm run test:unit
      - name: Real blocking, original tools, isolation and lifecycle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:shield-provider:desktop
            xvfb-run -a npm run test:ublock:desktop
            xvfb-run -a npm run test:ublock-dashboard:desktop
            xvfb-run -a npm run test:ublock-retirement:desktop
            xvfb-run -a npm run test:ublock-unavailable:desktop
            xvfb-run -a npm run test:ublock-noscript:desktop
            xvfb-run -a npm run test:ublock-slow-install:desktop
          else
            npm run test:shield-provider:desktop
            npm run test:ublock:desktop
            npm run test:ublock-dashboard:desktop
            npm run test:ublock-retirement:desktop
            npm run test:ublock-unavailable:desktop
            npm run test:ublock-noscript:desktop
            npm run test:ublock-slow-install:desktop
          fi

  intel-audio:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.intel_audio && github.ref == 'refs/heads/codex/ecs-production-integration' }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --foreground-scripts
      - name: Prepare unmodified version-matched audio controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = x86_64
          test "$(node -p 'process.arch')" = x64
          mkdir -p "$RUNNER_TEMP/official-audio"
          gh release download v44.9.3 -R electron/electron -p electron-v44.9.3-darwin-x64.zip -p SHASUMS256.txt -D "$RUNNER_TEMP/official-audio"
          cd "$RUNNER_TEMP/official-audio"
          awk '$2 == "*electron-v44.9.3-darwin-x64.zip" || $2 == "electron-v44.9.3-darwin-x64.zip"' SHASUMS256.txt > expected.sha256
          test "$(wc -l < expected.sha256 | tr -d ' ')" = 1
          shasum -a 256 -c expected.sha256
          ditto -x -k electron-v44.9.3-darwin-x64.zip .
          echo "OFFICIAL_AUDIO_EXECUTABLE=$RUNNER_TEMP/official-audio/Electron.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          node -e 'require("./scripts/prepare-ecs-runtime.cjs").prepareEcsRuntime("darwin","x64").then(r=>require("node:fs").appendFileSync(process.env.GITHUB_ENV,"ECS_AUDIO_EXECUTABLE="+r.directory+"/Electron.app/Contents/MacOS/Electron\n"))'
          swiftc test/desktop/native-audio-clock.swift -o "$RUNNER_TEMP/native-audio-clock"
          echo "NATIVE_AUDIO_PROBE=$RUNNER_TEMP/native-audio-clock" >> "$GITHUB_ENV"
      - name: Compare local PCM media, Web Audio and native CoreAudio
        run: node test/desktop/intel-audio-comparison.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: intel-audio-comparison-${{ github.run_id }}
          path: output/ecs-production/intel-audio-comparison.json
          if-no-files-found: error
          retention-days: 3

  ecs-updater-intel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ecs_intel_updater && github.ref == 'refs/heads/codex/ecs-production-integration' }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    # Same temporary owner-approved private draft read permission as intake.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Fetch verified public baseline and private staging update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ecs-update-download" "$RUNNER_TEMP/ecs-update-old" "$RUNNER_TEMP/ecs-update-target" "$RUNNER_TEMP/ecs-update-mount"
          gh release download v1.42.1 -R "$GITHUB_REPOSITORY" -p Blanc-1.42.1.dmg -p SHA256SUMS -D "$RUNNER_TEMP/ecs-update-download"
          gh release download ecs-private-intel-562ec1c87 -R "$GITHUB_REPOSITORY" -p Blanc-ECS-Intel-updater.zip -D "$RUNNER_TEMP/ecs-update-download"
          cd "$RUNNER_TEMP/ecs-update-download"
          awk '$2 == "Blanc-1.42.1.dmg"' SHA256SUMS > baseline.sha256
          test -s baseline.sha256
          shasum -a 256 -c baseline.sha256
          echo '7821125f69463194041bdccef112ae6f498c229d70411a7517bd751f5bf23e24  Blanc-ECS-Intel-updater.zip' | shasum -a 256 -c -
          hdiutil attach Blanc-1.42.1.dmg -mountpoint "$RUNNER_TEMP/ecs-update-mount" -readonly -nobrowse
          ditto "$RUNNER_TEMP/ecs-update-mount/Blanc.app" "$RUNNER_TEMP/ecs-update-old/Blanc.app"
          hdiutil detach "$RUNNER_TEMP/ecs-update-mount"
          ditto -x -k Blanc-ECS-Intel-updater.zip "$RUNNER_TEMP/ecs-update-target"
      - name: Verify signed inputs before any updater runs
        run: |
          test "$(uname -m)" = x86_64
          test "$(node -p 'process.arch')" = x64
          echo "200f5412859e05f5498c0add508594950aae6fa226f9009831840e2f528bf5c8  $RUNNER_TEMP/ecs-update-target/Blanc.app/Contents/Resources/app.asar" | shasum -a 256 -c -
          for KIND in old target; do
            APP="$RUNNER_TEMP/ecs-update-$KIND/Blanc.app"
            codesign --verify --deep --strict "$APP"
            bash scripts/ci-intel-apple-tickets.sh "$APP"
          done
          npm version 1.43.0-staging.1 --no-git-tag-version
          npm run compliance:build
          node scripts/verify-ecs-production-package.cjs "$RUNNER_TEMP/ecs-update-target/Blanc.app"
          node -e 'require("./scripts/after-sign-verify.js")({electronPlatformName:"darwin",appOutDir:process.env.RUNNER_TEMP+"/ecs-update-target",packager:{appInfo:{productFilename:"Blanc"}}}).catch(e=>{console.error(e);process.exitCode=1})'
      - name: Exercise the actual native Restart Now handoff and protected successor
        env:
          BLANC_ECS_DISPOSABLE_HOST: '1'
        run: |
          node test/desktop/ecs-production-updater-mac.mjs \
            "$RUNNER_TEMP/ecs-update-old/Blanc.app" \
            "$RUNNER_TEMP/ecs-update-download/Blanc-ECS-Intel-updater.zip" \
            1.43.0-staging.1 200f5412859e05f5498c0add508594950aae6fa226f9009831840e2f528bf5c8 \
            "$PWD/output/ecs-production/updater-intel.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: signed-ecs-updater-intel-${{ github.run_id }}
          path: output/ecs-production/*.json
          if-no-files-found: error
          retention-days: 3

  ecs-signed-intel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ecs_signed_intel && github.ref == 'refs/heads/codex/ecs-production-integration' }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    # Temporary, explicitly owner-approved: GitHub requires write permission
    # to download an unpublished draft. No publishing or mutation step exists.
    permissions:
      contents: write
    env:
      BLANC_UPDATE_CHANNEL: ecs-qualification-disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Fetch exact notarized package from temporary private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ecs-intake"
          gh release download ecs-private-intel-562ec1c87 -R "$GITHUB_REPOSITORY" \
            -p Blanc-ECS-Intel-562ec1c87.zip -D "$RUNNER_TEMP/ecs-intake"
          cd "$RUNNER_TEMP/ecs-intake"
          echo '43a8cf88f6b88244d85804747372dba4d6e342d4a42257053d70e6f8dbe96d3a  Blanc-ECS-Intel-562ec1c87.zip' | shasum -a 256 -c -
          ditto -x -k Blanc-ECS-Intel-562ec1c87.zip .
          echo "BLANC_PACKAGED_EXECUTABLE=$PWD/Blanc.app/Contents/MacOS/Blanc" >> "$GITHUB_ENV"
          echo "BLANC_PACKAGED_ASAR=$PWD/Blanc.app/Contents/Resources/app.asar" >> "$GITHUB_ENV"
          echo "BLANC_ECS_PACKAGE_ROOT=$PWD/Blanc.app" >> "$GITHUB_ENV"
      - name: Verify native hardware, exact payload, Apple trust and unchanged restrictions
        run: |
          test "$(uname -m)" = x86_64
          test "$(node -p 'process.arch')" = x64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || echo 0)" != 1
          echo "214105f60808638fef064332f2f5f0ca80ccb8f94af2ee84ad315bb9ad02e03e  $BLANC_PACKAGED_EXECUTABLE" | shasum -a 256 -c -
          echo "c94ad5d6a834f79463f847a59b3f493838f08dc2e946c42bfaae2e7d4755c8c9  $BLANC_PACKAGED_ASAR" | shasum -a 256 -c -
          test "$(lipo -archs "$BLANC_PACKAGED_EXECUTABLE")" = x86_64
          codesign --verify --deep --strict "$BLANC_ECS_PACKAGE_ROOT"
          bash scripts/ci-intel-apple-tickets.sh "$BLANC_ECS_PACKAGE_ROOT"
          node scripts/verify-ecs-production-package.cjs "$BLANC_ECS_PACKAGE_ROOT"
          node -e 'require("./scripts/after-sign-verify.js")({electronPlatformName:"darwin",appOutDir:process.env.RUNNER_TEMP+"/ecs-intake",packager:{appInfo:{productFilename:"Blanc"}}}).catch(e=>{console.error(e);process.exitCode=1})'
      - name: Native Intel uBO controls, real restarts, reopen and Quit
        env:
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/output/ecs-production/ublock-intel.json
        run: node test/desktop/support/installed-mac-native-quit.mjs
      - name: Native Intel offline startup and protected playback
        run: |
          node test/desktop/ecs-production-smoke.mjs
          node test/desktop/ecs-production-drm-smoke.mjs
      - name: Native Intel local HTML and browser compatibility
        run: |
          node test/desktop/ecs-local-html-smoke.cjs "$BLANC_ECS_PACKAGE_ROOT" output/ecs-production/local-html-intel.json
          node test/desktop/packaged-workspace-recovery-smoke.mjs
          node test/desktop/packaged-media-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: signed-ecs-native-intel-${{ github.run_id }}
          path: output/ecs-production/*.json
          if-no-files-found: error
          retention-days: 3

  installed-intel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installed_intel }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      # Intel's default is still Xcode 16.4; Blanc's committed Icon Composer
      # inputs require the already-installed Xcode 26 compiler.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run ublock:check
      # No signing credentials leave the owner Mac. This proves native Intel
      # packaged behavior only, and never clears the signed-installed gate.
      - name: Build unsigned private Intel fixture
        env:
          BLANC_UBLOCK_INTERNAL_BUILD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node <<'NODE'
          const { build, Platform, Arch } = require('electron-builder');
          build({ targets: Platform.MAC.createTarget(['dmg'], Arch.x64), publish: 'never',
            config: { mac: { identity: null }, afterSign: null } })
            .catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Install the actual DMG fixture
        run: |
          DMG="$PWD/dist/Blanc-$(node -p "require('./package.json').version").dmg"
          MOUNT="$RUNNER_TEMP/blanc-intel-dmg"
          mkdir -p "$MOUNT" "$RUNNER_TEMP/Applications"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -readonly -nobrowse
          ditto "$MOUNT/Blanc.app" "$RUNNER_TEMP/Applications/Blanc.app"
          hdiutil detach "$MOUNT"
          node scripts/verify-electron-fuses.mjs "$RUNNER_TEMP/Applications/Blanc.app/Contents/MacOS/Blanc"
          node scripts/verify-packaged-ublock.js "$RUNNER_TEMP/Applications/Blanc.app/Contents/Resources/app.asar"
      - name: Native Intel installed controls, persistence, restarts and Quit
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ runner.temp }}/Applications/Blanc.app/Contents/MacOS/Blanc
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/dist/ublock-installed-intel-unsigned.json
        run: node test/desktop/support/installed-mac-native-quit.mjs
      - name: Native Intel installed scripting policy
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ runner.temp }}/Applications/Blanc.app/Contents/MacOS/Blanc
          BLANC_PACKAGED_ASAR: ${{ runner.temp }}/Applications/Blanc.app/Contents/Resources/app.asar
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/dist/ublock-noscript-intel-unsigned.json
        run: npm run test:ublock-noscript:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unsigned-native-intel-observations-${{ github.run_id }}
          path: dist/ublock-*-intel-unsigned.json
          retention-days: 14

  linux-native-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_native_diagnostics }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable native Linux renderer sandbox
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci --no-audit --no-fund
      - name: Prepare official native debugger
        run: |
          command -v gdb || { sudo apt-get update; sudo apt-get install -y gdb; }
          chmod +x test/desktop/support/electron-native-debug.sh
      - name: Capture isolated browser-process native stacks
        shell: bash
        run: |
          mkdir -p dist/native-diagnostics
          export BLANC_UBLOCK_NATIVE_STACK_DIR="$PWD/dist/native-diagnostics"
          export BLANC_UBLOCK_NATIVE_EXECUTABLE="$PWD/node_modules/electron/dist/electron"
          export BLANC_UBLOCK_ELECTRON="$PWD/test/desktop/support/electron-native-debug.sh"
          export BLANC_UBLOCK_RESTORE_STRESS=1
          # Write directly: detached crash-handler children may retain the
          # debugger's output handles after the browser has exited.
          for attempt in 1 2 3; do
            xvfb-run -a npm run test:ublock:desktop > "dist/native-diagnostics/restore-stress-$attempt.log" 2>&1
            tail -n 40 "dist/native-diagnostics/restore-stress-$attempt.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-native-stacks-${{ github.run_id }}
          path: dist/native-diagnostics/*
          retention-days: 3
