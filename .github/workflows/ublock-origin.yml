name: Full uBlock Origin candidate
on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/renderer/renderer.js'
      - 'src/renderer/overlay*'
      - 'src/renderer/index.html'
      - 'src/renderer/styles.css'
      - 'src/renderer/pages/settings*'
      - 'src/renderer/ublock-*'
      - 'src/renderer/ublock-popup-icons/**'
      - 'ublock/**'
      - 'test/desktop/ublock*'
      - 'test/desktop/shield-provider*'
      - 'test/desktop/support/**'
      - 'test/unit/ublock*'
      - 'test/unit/blocking*'
      - 'test/unit/shield*'
      - 'scripts/*ublock*'
      - 'scripts/*capture-preload*'
      - 'scripts/verify-packaged-*'
      - 'scripts/generate-compliance*'
      - 'adblock/**'
      - 'compliance/**'
      - '.gitattributes'
      - 'package*.json'
      - '.github/workflows/ublock-origin.yml'
  workflow_dispatch:
    inputs:
      installed_intel:
        description: "Also exercise an unsigned installed Intel package (not signing acceptance)"
        type: boolean
        default: false
      installed_signed_intel:
        description: "Test the exact owner-approved signed Intel transfer (no publication)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ordinary-package:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.installed_intel && !inputs.installed_signed_intel) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build ordinary public payload with its production allowlist
        run: npx electron-builder --linux --dir --publish never
      - name: Verify ordinary payload and exclusion boundary
        run: node scripts/verify-packaged-ublock.js dist/linux-unpacked/resources/app.asar
  desktop:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.installed_intel && !inputs.installed_signed_intel) }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve verified bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Unit evidence checks read immutable release tags and commits.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable native Linux renderer sandbox
        if: runner.os == 'Linux'
        run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run ublock:check
      - run: npm run lint
      - run: npm run test:unit
      - name: Real blocking, original tools, isolation and lifecycle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:shield-provider:desktop
            xvfb-run -a npm run test:ublock:desktop
            xvfb-run -a npm run test:ublock-dashboard:desktop
            xvfb-run -a npm run test:ublock-retirement:desktop
            xvfb-run -a npm run test:ublock-unavailable:desktop
            xvfb-run -a npm run test:ublock-noscript:desktop
          else
            npm run test:shield-provider:desktop
            npm run test:ublock:desktop
            npm run test:ublock-dashboard:desktop
            npm run test:ublock-retirement:desktop
            npm run test:ublock-unavailable:desktop
            npm run test:ublock-noscript:desktop
          fi

  installed-intel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installed_intel }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      # Intel's default is still Xcode 16.4; Blanc's committed Icon Composer
      # inputs require the already-installed Xcode 26 compiler.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run ublock:check
      # No signing credentials leave the owner Mac. This proves native Intel
      # packaged behavior only, and never clears the signed-installed gate.
      - name: Build unsigned private Intel fixture
        env:
          BLANC_UBLOCK_INTERNAL_BUILD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node <<'NODE'
          const { build, Platform, Arch } = require('electron-builder');
          build({ targets: Platform.MAC.createTarget(['dmg'], Arch.x64), publish: 'never',
            config: { mac: { identity: null }, afterSign: null } })
            .catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Install the actual DMG fixture
        run: |
          DMG="$PWD/dist/Blanc-$(node -p "require('./package.json').version").dmg"
          MOUNT="$RUNNER_TEMP/blanc-intel-dmg"
          mkdir -p "$MOUNT" "$RUNNER_TEMP/Applications"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -readonly -nobrowse
          ditto "$MOUNT/Blanc.app" "$RUNNER_TEMP/Applications/Blanc.app"
          hdiutil detach "$MOUNT"
          node scripts/verify-electron-fuses.mjs "$RUNNER_TEMP/Applications/Blanc.app/Contents/MacOS/Blanc"
          node scripts/verify-packaged-ublock.js "$RUNNER_TEMP/Applications/Blanc.app/Contents/Resources/app.asar"
      - name: Native Intel installed controls, persistence, restarts and Quit
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ runner.temp }}/Applications/Blanc.app/Contents/MacOS/Blanc
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/dist/ublock-installed-intel-unsigned.json
        run: node test/desktop/support/installed-mac-native-quit.mjs
      - name: Native Intel installed scripting policy
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ runner.temp }}/Applications/Blanc.app/Contents/MacOS/Blanc
          BLANC_PACKAGED_ASAR: ${{ runner.temp }}/Applications/Blanc.app/Contents/Resources/app.asar
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/dist/ublock-noscript-intel-unsigned.json
        run: npm run test:ublock-noscript:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unsigned-native-intel-observations-${{ github.run_id }}
          path: dist/ublock-*-intel-unsigned.json
          retention-days: 14

  installed-signed-intel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installed_signed_intel }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Intake is bound to the reviewed, notarized owner-built artifact. No
      # Apple credentials, signing key, public feed or build override is used.
      - name: Download exact private signed Intel candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p signed-intake
          gh release download ubo-private-intel-1273-0872ed72 --repo "$GITHUB_REPOSITORY" --pattern 'Blanc-1.27.0.dmg' --dir signed-intake
          printf '%s  %s\n' '58408120dc32ab25ab49ce76a98285fddfaa8991f69f8793bdee9b77ba34e38e' 'signed-intake/Blanc-1.27.0.dmg' | shasum -a 256 -c -
      - name: Install exact DMG and verify publisher, notarization and bytes
        run: |
          MOUNT="$RUNNER_TEMP/blanc-signed-intel-dmg"
          APP="$RUNNER_TEMP/Applications/Blanc.app"
          mkdir -p "$MOUNT" "$RUNNER_TEMP/Applications"
          hdiutil attach signed-intake/Blanc-1.27.0.dmg -mountpoint "$MOUNT" -readonly -nobrowse
          ditto "$MOUNT/Blanc.app" "$APP"
          hdiutil detach "$MOUNT"
          spctl --assess --type execute --verbose=4 "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          codesign --display --extract-certificates="$RUNNER_TEMP/intel-cert" "$APP"
          CERT=$(openssl x509 -inform DER -in "$RUNNER_TEMP/intel-cert0" -noout -fingerprint -sha1 | sed 's/.*=//;s/://g')
          test "$CERT" = 55283A84D3706D5A22386D5F002A0CD4845ECFD4
          printf '%s  %s\n' 'd7139aea0780fc823b5ca169199ca4c5bddeee8889841d440f647a0d7c3a2162' "$APP/Contents/MacOS/Blanc" | shasum -a 256 -c -
          printf '%s  %s\n' '5c80d8702a062dd3e26f29dfdf48439e7d2dc690534da1eb667e5165b42064bf' "$APP/Contents/Resources/app.asar" | shasum -a 256 -c -
          node scripts/verify-electron-fuses.mjs "$APP/Contents/MacOS/Blanc"
          node scripts/verify-packaged-ublock.js "$APP/Contents/Resources/app.asar"
      - name: Signed native Intel controls, persistence, provider restarts and Quit
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ runner.temp }}/Applications/Blanc.app/Contents/MacOS/Blanc
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/signed-intake/ublock-installed-intel-signed.json
        run: node test/desktop/support/installed-mac-native-quit.mjs
      - name: Signed native Intel scripting policy
        env:
          BLANC_PACKAGED_EXECUTABLE: ${{ runner.temp }}/Applications/Blanc.app/Contents/MacOS/Blanc
          BLANC_PACKAGED_ASAR: ${{ runner.temp }}/Applications/Blanc.app/Contents/Resources/app.asar
          BLANC_UBLOCK_EVIDENCE: ${{ github.workspace }}/signed-intake/ublock-noscript-intel-signed.json
        run: npm run test:ublock-noscript:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: signed-native-intel-observations-${{ github.run_id }}
          path: signed-intake/ublock-*-intel-signed.json
          retention-days: 14
