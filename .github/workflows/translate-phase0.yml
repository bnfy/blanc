# .github/workflows/translate-phase0.yml
# F43 Phase 0 feasibility: build Bergamot from a pinned commit, then measure it
# in an unattached sandboxed WebContentsView on Apple Silicon, Intel Mac and Windows.
# Spec: docs/superpowers/specs/2026-10-08-on-device-translation-design.md
name: translate-phase0

on:
  push:
    branches: [spike/translate-phase0]
    # Only the first-round harness; the behind-page round has its own workflow.
    paths:
      - bench/translate/harness/main.js
      - bench/translate/harness/engine.js
      - bench/translate/harness/preload.js
      - bench/translate/wrap-engine.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/translations
          ref: 69455acaecbe8650cdba988dbcf7c10ca20e7c48
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build Bergamot WASM (upstream script, emsdk 3.1.8)
        working-directory: upstream
        env:
          ALLOW_RUN_ON_HOST: '1'
        run: python3 inference/scripts/build-wasm.py
      - name: Wrap and hash engine
        run: node bench/translate/wrap-engine.mjs upstream/inference/build-wasm engine-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translate-engine
          path: engine-out
          retention-days: 14
          if-no-files-found: error

  measure:
    needs: build-engine
    strategy:
      fail-fast: false
      matrix:
        label: [macos-arm64, macos-x64, windows-x64]
        # production = the F43 engine host as designed; nobg = diagnostic
        # ceiling with Chromium renderer backgrounding disabled app-wide.
        variant: [production, nobg]
        include:
          - label: macos-arm64
            runner: macos-15
          - label: macos-x64
            runner: macos-15-intel
          - label: windows-x64
            runner: windows-latest
          - variant: production
            electron_flags: ''
          - variant: nobg
            electron_flags: '--disable-renderer-backgrounding'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: translate-engine
          path: bench/translate/.cache/engine
      - run: node bench/translate/fetch-inputs.mjs
      - run: npx electron ${{ matrix.electron_flags }} bench/translate/harness/main.js --out=bench/translate/results/${{ matrix.label }}-${{ matrix.variant }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translate-results-${{ matrix.label }}-${{ matrix.variant }}
          path: bench/translate/results/${{ matrix.label }}-${{ matrix.variant }}
          retention-days: 14
          if-no-files-found: error
