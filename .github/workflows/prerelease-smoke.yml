name: Flatpak 1.43.1 isolated investigation
on:
  workflow_dispatch:
    inputs:
      modes:
        description: Comma-separated startup variants; blank runs the complete matrix
        required: false
        type: string
      real_package:
        description: Use FlatPark's install-time extra-data extraction and original application path
        required: false
        type: boolean
        default: false
      flatpark_sha:
        description: Exact bnfy/flatpark commit to validate instead of the investigation package
        required: false
        type: string
permissions:
  contents: read
jobs:
  flatpak:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder libarchive-tools jq appstream appstream-util xvfb xdotool squashfs-tools g++ python3
      - name: Compare startup paths and inspect renderer sandbox
        if: inputs.flatpark_sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BLANC_FLATPAK_MODES: ${{ inputs.modes }}
          BLANC_REAL_PACKAGE: ${{ inputs.real_package }}
        run: bash scripts/flatpak-investigation.sh
      - name: Verify exact FlatPark PR package
        if: inputs.flatpark_sha != ''
        env:
          FLATPARK_PR_SHA: ${{ inputs.flatpark_sha }}
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash scripts/flatpark-pr-validation.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flatpak-1431-evidence
          path: |
            flatpak-evidence/*.log
            flatpak-evidence/*.json
            flatpak-evidence/*.jsonl
            flatpak-evidence/*.txt
            flatpak-evidence/*.png
            flatpak-evidence/*.overrides
            flatpak-evidence/*.patch
            flatpak-evidence/*.cc
            flatpak-evidence/blanc-ecs-launcher-candidate
            flatpak-evidence/*.yml
            flatpak-evidence/SHA256SUMS*
          retention-days: 7
