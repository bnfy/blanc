name: Unit tests

# Pull requests always report a merge gate. Website-only PRs run the Site
# suite and skip the Windows and macOS matrix. Shared inputs run both. Pushes
# to main still test merged combinations on both platforms.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify website changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.paths.outputs.website }}
      website_only: ${{ steps.paths.outputs.website_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # PR merge commit and its base parent.
      - id: paths
        shell: bash
        run: |
          git rev-parse --verify HEAD^2 >/dev/null
          git diff --name-only -z --no-renames HEAD^1 HEAD | bash scripts/ci-website-paths.sh >> "$GITHUB_OUTPUT"

  site:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.website == 'true' }}
    uses: ./.github/workflows/site.yml

  unit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.website_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    # GitHub-hosted, even with the self-hosted Mac set up: there it waited a
    # median 24 minutes (up to 72) for one of its two VM slots (October 26,
    # 2026). docs/ci-self-hosted-macos-runner.md
    runs-on: ${{ matrix.os }}
    # Windows usually finishes in about 6 minutes, but a slow runner hit 15
    # twice on October 30, 2026 (the sync-pairing tests ran a minute each).
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Preserve verified bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Unit evidence checks read immutable release tags and commits.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit

  website-and-unit-checks:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, site, unit]
    runs-on: ubuntu-latest
    steps:
      - name: Require the suites selected for this change
        env:
          PATHS_RESULT: ${{ needs.changes.result }}
          WEBSITE: ${{ needs.changes.outputs.website }}
          WEBSITE_ONLY: ${{ needs.changes.outputs.website_only }}
          SITE_RESULT: ${{ needs.site.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          case "$PATHS_RESULT:$WEBSITE:$WEBSITE_ONLY:$SITE_RESULT:$UNIT_RESULT" in
            success:true:true:success:skipped) ;;
            success:true:false:success:success) ;;
            success:false:false:skipped:success) ;;
            *) echo "::error::Expected suites did not pass (paths=$PATHS_RESULT, website=$WEBSITE, website_only=$WEBSITE_ONLY, site=$SITE_RESULT, unit=$UNIT_RESULT)"; exit 1 ;;
          esac
