name: Unit tests

# Runs the unit suite on Windows and macOS for every pull request. Parity guards
# already run it on Linux for every pull request; the uBlock Origin workflow
# runs it on all four desktop targets only nightly and on manual runs, so a
# test-only change otherwise never runs on Windows or macOS (#608). No path
# filter here on purpose: a platform-specific failure can come from any file.
# It also runs on every push to main: main doesn't require a pull request to be
# up to date before merging, so two pull requests that each passed are only
# tested together here. A newer push cancels a run still in progress.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    # GitHub-hosted, even with the self-hosted Mac set up: there it waited a
    # median 24 minutes (up to 72) for one of its two VM slots (October 26,
    # 2026). docs/ci-self-hosted-macos-runner.md
    runs-on: ${{ matrix.os }}
    # Windows usually finishes in about 6 minutes, but a slow runner hit 15
    # twice on October 30, 2026 (the sync-pairing tests ran a minute each).
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Preserve verified bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Unit evidence checks read immutable release tags and commits.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
