# Starts the Android security clock (docs/android/channels.md): once a day, compare Chrome stable for
# Android with the lane's pin and keep one open issue labeled android-security-clock while it's behind.
name: android-stable-watch

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: android-stable-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node chromium/android/release/stable-watch.mjs --issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
