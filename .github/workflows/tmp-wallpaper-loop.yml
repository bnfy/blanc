# TEMPORARY (remove before merge): runs the wallpaper smoke many times on
# Linux to catch its intermittent fade-out timeout with the new timeline.
name: tmp-wallpaper-loop
on:
  pull_request:
    paths: [.github/workflows/tmp-wallpaper-loop.yml, test/desktop/newtab-wallpaper-smoke.mjs]
permissions:
  contents: read
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/ci-enable-linux-sandbox.sh
      - run: npm ci
      - name: Wallpaper smoke four times
        run: |
          fails=0
          for i in 1 2 3 4; do
            echo "=== run $i"
            xvfb-run -a npm run test:wallpaper:desktop || fails=$((fails+1))
          done
          echo "failures: $fails of 4"
          [ "$fails" -eq 0 ]
