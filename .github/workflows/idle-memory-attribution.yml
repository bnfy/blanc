name: Idle memory attribution

# Temporary measurement job for the idle-memory investigation: does the Dock
# icon applied at startup hold browser-process memory on macOS 26+? Each runner
# compares a re-signed public 1.34.0 against the same build with
# applyDockAppIcon disabled. Not a gate.
on:
  workflow_dispatch:
  push:
    branches: [claude/clever-albattani-087dyh]
    paths:
      - '.github/workflows/idle-memory-attribution.yml'

permissions:
  contents: read

jobs:
  attribute:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Describe the runner
        run: |
          sw_vers
          osascript -l JavaScript -e 'ObjC.import("AppKit"); const s = $.NSScreen.mainScreen; "backingScaleFactor " + s.backingScaleFactor + " frame " + s.frame.size.width + "x" + s.frame.size.height'
      - name: Download and mount public 1.34.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=1.34.0
          dir="$RUNNER_TEMP/dmg-$v"
          mkdir -p "$dir" "$RUNNER_TEMP/mnt-$v"
          gh release download "v$v" --repo "$GITHUB_REPOSITORY" \
            --pattern "Blanc-$v-arm64.dmg" --pattern SHA256SUMS --dir "$dir"
          expected=$(awk -v f="Blanc-$v-arm64.dmg" '$2 == f { print $1 }' "$dir/SHA256SUMS")
          actual=$(shasum -a 256 "$dir/Blanc-$v-arm64.dmg" | awk '{ print $1 }')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "digest mismatch" >&2; exit 1; }
          hdiutil attach "$dir/Blanc-$v-arm64.dmg" -mountpoint "$RUNNER_TEMP/mnt-$v" -readonly -nobrowse
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$RUNNER_TEMP/mnt-$v/Blanc.app/Contents/Info.plist" || true
          ls -la "$RUNNER_TEMP/mnt-$v/Blanc.app/Contents/Resources" | grep -iE 'Assets.car|\.icns' || true
      - name: Build re-signed variants of 1.34.0
        # The control is repacked and ad-hoc signed exactly like the variant.
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/mnt-1.34.0/Blanc.app"
          ASAR=node_modules/@electron/asar/bin/asar.mjs
          variant() {
            name=$1
            app="$RUNNER_TEMP/variants/$name/Blanc.app"
            mkdir -p "$(dirname "$app")"
            ditto "$SRC" "$app"
            work="$RUNNER_TEMP/asar-$name"
            node "$ASAR" extract "$app/Contents/Resources/app.asar" "$work"
            if [ "$name" = nodock ]; then
              sed -i '' -E "s/^  if \(platform !== 'darwin' \|\| !app\.dock\) return null;$/  return null;/" "$work/src/main/app-icon.js"
              grep -c '^  return null;$' "$work/src/main/app-icon.js"
            fi
            rm "$app/Contents/Resources/app.asar"
            node "$ASAR" pack "$work" "$app/Contents/Resources/app.asar"
            hash=$(node -e 'const a=require("@electron/asar");const h=a.getRawHeader(process.argv[1]);console.log(require("crypto").createHash("sha256").update(h.headerString).digest("hex"))' "$app/Contents/Resources/app.asar")
            /usr/libexec/PlistBuddy -c "Set :ElectronAsarIntegrity:Resources/app.asar:hash $hash" "$app/Contents/Info.plist"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
          }
          for name in control nodock; do variant "$name"; done
      - name: Attribute the Dock icon at idle
        run: |
          set -euo pipefail
          node bench/memory/idle-attribution.js \
            "--app=$RUNNER_TEMP/variants/control/Blanc.app=control" \
            "--app=$RUNNER_TEMP/variants/nodock/Blanc.app=nodock" \
            --reps=4 --sudo --out="$RUNNER_TEMP/results/dock-${{ matrix.runner }}"
          cat "$RUNNER_TEMP"/results/dock-${{ matrix.runner }}/*.md >> "$GITHUB_STEP_SUMMARY"
