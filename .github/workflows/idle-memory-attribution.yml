name: Idle memory attribution

# Temporary measurement job for the idle-memory investigation: per-process
# phys_footprint of public Apple Silicon releases and of locally re-signed
# variants of 1.34.0, measured in one session on one hosted Mac. Not a gate.
on:
  workflow_dispatch:
  push:
    branches: [claude/clever-albattani-087dyh]
    paths:
      - '.github/workflows/idle-memory-attribution.yml'
      - 'bench/memory/idle-attribution.js'

permissions:
  contents: read

jobs:
  attribute:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download and mount public 1.34.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=1.34.0
          dir="$RUNNER_TEMP/dmg-$v"
          mkdir -p "$dir" "$RUNNER_TEMP/mnt-$v"
          gh release download "v$v" --repo "$GITHUB_REPOSITORY" \
            --pattern "Blanc-$v-arm64.dmg" --pattern SHA256SUMS --dir "$dir"
          expected=$(awk -v f="Blanc-$v-arm64.dmg" '$2 == f { print $1 }' "$dir/SHA256SUMS")
          actual=$(shasum -a 256 "$dir/Blanc-$v-arm64.dmg" | awk '{ print $1 }')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "digest mismatch" >&2; exit 1; }
          hdiutil attach "$dir/Blanc-$v-arm64.dmg" -mountpoint "$RUNNER_TEMP/mnt-$v" -readonly -nobrowse
      - name: Build re-signed variants of 1.34.0
        # Every variant, the control included, is repacked and ad-hoc signed
        # the same way, so signing and repacking cannot explain a difference.
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/mnt-1.34.0/Blanc.app"
          ASAR=node_modules/@electron/asar/bin/asar.mjs
          ls "$SRC/Contents/Resources" | grep -i asar
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=' | base64 -d > "$RUNNER_TEMP/1x1.png"
          variant() {
            name=$1
            app="$RUNNER_TEMP/variants/$name/Blanc.app"
            mkdir -p "$(dirname "$app")"
            ditto "$SRC" "$app"
            work="$RUNNER_TEMP/asar-$name"
            node "$ASAR" extract "$app/Contents/Resources/app.asar" "$work"
            case "$name" in
              control) ;;
              noblur)
                sed -i '' -E '/^  (-webkit-)?backdrop-filter: blur\(16px\);$/d' "$work/src/renderer/styles.css"
                ;;
              nofooterblur)
                sed -i '' -E '/^  backdrop-filter: blur\(14px\);$/d' "$work/src/renderer/pages/pages.css"
                ;;
              noblurboth)
                sed -i '' -E '/^  (-webkit-)?backdrop-filter: blur\(16px\);$/d' "$work/src/renderer/styles.css"
                sed -i '' -E '/^  backdrop-filter: blur\(14px\);$/d' "$work/src/renderer/pages/pages.css"
                ;;
              nohelper)
                sed -i '' -E '/^  win\.loadURL\(CHROME_DISPLAY_CAPTURE_HELPER_URL\);$/d' "$work/src/main/display-capture-broker-playout.js"
                ;;
            esac
            echo "$name: $(grep -c 'backdrop-filter: blur(16px)' "$work/src/renderer/styles.css" || true) strip blur, $(grep -c 'backdrop-filter: blur(14px)' "$work/src/renderer/pages/pages.css" || true) footer blur, $(grep -c 'win.loadURL(CHROME_DISPLAY_CAPTURE_HELPER_URL)' "$work/src/main/display-capture-broker-playout.js" || true) helper load"
            rm "$app/Contents/Resources/app.asar"
            node "$ASAR" pack "$work" "$app/Contents/Resources/app.asar"
            hash=$(node -e 'const a=require("@electron/asar");const h=a.getRawHeader(process.argv[1]);console.log(require("crypto").createHash("sha256").update(h.headerString).digest("hex"))' "$app/Contents/Resources/app.asar")
            /usr/libexec/PlistBuddy -c "Set :ElectronAsarIntegrity:Resources/app.asar:hash $hash" "$app/Contents/Info.plist"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
          }
          for name in control noblur noblurboth; do variant "$name"; done
      - name: Attribute the variants with a website as the active tab (2x scale)
        run: |
          set -euo pipefail
          args=()
          for name in control noblur noblurboth; do args+=("--app=$RUNNER_TEMP/variants/$name/Blanc.app=$name"); done
          node bench/memory/idle-attribution.js "${args[@]}" --reps=4 --sudo \
            --url=https://example.com/ \
            --extra-arg=--force-device-scale-factor=2 --out="$RUNNER_TEMP/results/website-scale2"
          cat "$RUNNER_TEMP"/results/website-scale2/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attribute the variants with a website as the active tab (native scale)
        run: |
          set -euo pipefail
          node bench/memory/idle-attribution.js \
            "--app=$RUNNER_TEMP/variants/control/Blanc.app=control" \
            "--app=$RUNNER_TEMP/variants/noblur/Blanc.app=noblur" \
            --url=https://example.com/ --reps=3 --sudo --out="$RUNNER_TEMP/results/website-native"
          cat "$RUNNER_TEMP"/results/website-native/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idle-memory-attribution
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
