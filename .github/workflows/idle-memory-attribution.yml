name: Idle memory attribution

# Temporary measurement job: the Dock icon fix in src/main/app-icon.js applied
# to the public 1.34.0, against a control and the earlier no-Dock-call variant,
# built with bench/memory/make-variant.js. Not a gate; removed after use.
on:
  workflow_dispatch:
  push:
    branches: [claude/clever-albattani-087dyh]
    paths:
      - '.github/workflows/idle-memory-attribution.yml'

permissions:
  contents: read

jobs:
  attribute:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download and mount public 1.34.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=1.34.0
          dir="$RUNNER_TEMP/dmg-$v"
          mkdir -p "$dir" "$RUNNER_TEMP/mnt-$v"
          gh release download "v$v" --repo "$GITHUB_REPOSITORY" \
            --pattern "Blanc-$v-arm64.dmg" --pattern SHA256SUMS --dir "$dir"
          expected=$(awk -v f="Blanc-$v-arm64.dmg" '$2 == f { print $1 }' "$dir/SHA256SUMS")
          actual=$(shasum -a 256 "$dir/Blanc-$v-arm64.dmg" | awk '{ print $1 }')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "digest mismatch" >&2; exit 1; }
          hdiutil attach "$dir/Blanc-$v-arm64.dmg" -mountpoint "$RUNNER_TEMP/mnt-$v" -readonly -nobrowse
      - name: Build variants with make-variant.js
        run: |
          node bench/memory/make-variant.js --app="$RUNNER_TEMP/mnt-1.34.0/Blanc.app" \
            --out="$RUNNER_TEMP/variants" --variant=control --variant=checkout --variant=nodock \
            --checkout-file=src/main/app-icon.js
      - name: Measure at idle
        run: |
          set -euo pipefail
          node bench/memory/idle-attribution.js \
            "--app=$RUNNER_TEMP/variants/control/Blanc.app=control" \
            "--app=$RUNNER_TEMP/variants/checkout/Blanc.app=fix" \
            "--app=$RUNNER_TEMP/variants/nodock/Blanc.app=nodock" \
            --extra-arg=--use-mock-keychain --reps=4 --sudo --out="$RUNNER_TEMP/results/dockfix-${{ matrix.runner }}"
          cat "$RUNNER_TEMP"/results/dockfix-${{ matrix.runner }}/*.md >> "$GITHUB_STEP_SUMMARY"
