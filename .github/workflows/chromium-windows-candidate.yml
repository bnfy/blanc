# Runs a Windows build of the Chromium fork on a hosted Windows runner
# (docs/superpowers/specs/2026-11-17-windows-fork-design.md). The build is
# cross-compiled on the Linux build server and reaches GitHub as the asset of
# one reused, unpublished draft release, which only repository collaborators
# can read (chromium/windows/ship-candidate.sh). Run by hand from the fork
# branch, with the SHA-256 the packaging step printed:
#   gh workflow run chromium-windows-candidate.yml --ref chromium/next -f sha256=<sha256>
# The scripts it runs come from the ref it is dispatched on. A preview build
# is never a release: nothing here publishes, signs or distributes it.
name: chromium-windows-candidate

on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA-256 of the candidate zip, as printed when it was packaged
        required: true
        type: string
      suite:
        description: What to run after the launch check
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - f0
      only:
        description: Optional case-id text, to run a development subset of the suite
        required: false
        default: ''
        type: string
      repack:
        description: Also unpack and repack the installer, unsigned, and install the repacked one (W1 Part C dry run)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate:
    name: candidate (windows x64)
    runs-on: windows-2025
    timeout-minutes: 240
    # Draft releases are readable only with write access to contents, and the
    # build cannot pass between jobs as an artifact (artifacts of a public
    # repository are downloadable by any signed-in user). So this one job holds
    # the grant; the token is passed to the download step alone, and neither
    # the browser nor the test scripts receive it.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CANDIDATE_SHA256: ${{ inputs.sha256 }}
      SUITE: ${{ inputs.suite }}
      ONLY: ${{ inputs.only }}
      DRAFT_TAG: fork-windows-candidate
      ASSET: blanc-windows-candidate.zip
    steps:
      - name: Validate inputs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'sha256 must be 64 lowercase hex digits.' }
          if ($env:ONLY -notmatch '^[A-Za-z0-9 _.,:@-]{0,200}$') { throw 'only holds unsupported characters.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The harness reads shipping's own test files from Git at its pinned
      # shipping commits. The checkout is shallow (the full history is large),
      # so fetch exactly those; the repository is public, so no token.
      - name: Fetch the pinned shipping commits
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path chromium/windows/pinned-commits.mjs)) { throw "chromium/windows/pinned-commits.mjs is not on $env:GITHUB_REF_NAME. Run this workflow with --ref chromium/next." }
          $commits = @(node chromium/windows/pinned-commits.mjs)
          if ($LASTEXITCODE -ne 0 -or -not $commits) { throw 'Could not list the pinned shipping commits.' }
          foreach ($commit in $commits) {
            if ($commit -notmatch '^[0-9a-f]{40}$') { throw "Not a full commit: $commit" }
            git fetch --quiet --depth=1 origin $commit
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch shipping commit $commit." }
            git cat-file -e "${commit}:package.json"
            if ($LASTEXITCODE -ne 0) { throw "Shipping commit $commit is not readable." }
          }
          "Fetched: $($commits -join ', ')"
      - name: Download the candidate from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory "$env:RUNNER_TEMP\candidate" | Out-Null
          $draft = gh release view $env:DRAFT_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw "$env:DRAFT_TAG must exist and be an unpublished draft." }
          gh release download $env:DRAFT_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET --dir "$env:RUNNER_TEMP\candidate"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the candidate.' }
      - name: Verify and unpack it
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\candidate\$env:ASSET"
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:CANDIDATE_SHA256) { throw "The draft holds $actual, not the candidate asked for." }
          # bsdtar: faster than Expand-Archive and without its 260-character limit.
          New-Item -ItemType Directory "$env:RUNNER_TEMP\blanc" | Out-Null
          tar -xf $zip -C "$env:RUNNER_TEMP\blanc"
          if ($LASTEXITCODE -ne 0) { throw 'Could not unpack the candidate.' }
          if (-not (Test-Path "$env:RUNNER_TEMP\blanc\candidate.json")) { throw 'The zip has no candidate.json at its top level; it was not made by chromium/windows/package-candidate.mjs.' }
          # Chromium's sandboxed processes run as app containers and must be
          # able to read the folder the browser runs from; an installer grants
          # this (W1). Without it the browser stops at "Sandbox cannot access
          # executable". ALL APPLICATION PACKAGES and ALL RESTRICTED APPLICATION
          # PACKAGES get read and execute, as Chrome's own installer gives them.
          icacls "$env:RUNNER_TEMP\blanc" /grant '*S-1-15-2-1:(OI)(CI)(RX)' /grant '*S-1-15-2-2:(OI)(CI)(RX)' /T /Q
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant the sandbox access to the candidate folder.' }
          "CANDIDATE_DIR=$env:RUNNER_TEMP\blanc" >> $env:GITHUB_ENV
          "RESULTS=$env:RUNNER_TEMP\results" >> $env:GITHUB_ENV
          Get-Content "$env:RUNNER_TEMP\blanc\candidate.json"
      - name: Require the fork's Windows scripts on this ref
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in 'chromium/tests/windows-smoke.mjs', 'chromium/windows/run-suite.mjs') {
            if (-not (Test-Path $script)) { throw "$script is not on $env:GITHUB_REF_NAME. Run this workflow with --ref chromium/next." }
          }
      # The harness loads shipping modules and their packages; nothing it uses
      # needs an install script.
      - name: Install the harness's dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts
      # The hosted runner's display is 1024 by 768, and Windows will not make a
      # window larger than its screen, so cases that ask for a 1440-wide
      # window could never pass. Ask for a larger display and report what the
      # runner gave.
      - name: Use a larger display
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { "Set-DisplayResolution: $($_.Exception.Message)" }
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          "Display: $($screen.Bounds.Width) x $($screen.Bounds.Height), work area $($screen.WorkingArea.Width) x $($screen.WorkingArea.Height)"
      - name: Launch check
        run: node chromium/tests/windows-smoke.mjs "$env:CANDIDATE_DIR" "$env:RESULTS\smoke"
      # Real mouse and keyboard input against the window's own frame; it is
      # skipped on a ref that does not have the check yet.
      - name: Window frame check
        run: |
          if (Test-Path chromium/tests/windows-frame.mjs) { node chromium/tests/windows-frame.mjs "$env:CANDIDATE_DIR" "$env:RESULTS\frame" } else { 'No window frame check on this ref.' }
      # Chromium's installer beside an installed Electron Blanc (W1 Part B),
      # and whether a crash is captured. Skipped where the candidate or the
      # ref has neither.
      - name: Install check
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPACK: ${{ inputs.repack }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path chromium/tests/windows-install.mjs) -or -not (Test-Path "$env:CANDIDATE_DIR\mini_installer.exe")) { 'No installer check for this candidate or ref.'; exit 0 }
          $shipping = "$env:RUNNER_TEMP\shipping"
          New-Item -ItemType Directory $shipping | Out-Null
          gh release download v1.49.1 --repo $env:GITHUB_REPOSITORY --pattern 'Blanc-Setup-1.49.1.exe' --pattern 'SHA256SUMS' --dir $shipping
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the shipping installer.' }
          $expected = (Get-Content "$shipping\SHA256SUMS" | Where-Object { $_ -match 'Blanc-Setup-1\.49\.1\.exe$' }) -split '\s+' | Select-Object -First 1
          $actual = (Get-FileHash "$shipping\Blanc-Setup-1.49.1.exe" -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $actual -ne $expected.ToLower()) { throw "The shipping installer is $actual, not the release's $expected." }
          if ($env:REPACK -eq 'true') {
            # Part C's dry run: the installer taken apart and put back together
            # unsigned must install exactly as the original does. Chromium's
            # resedit.py needs pywin32, pinned by hash.
            $pin = "$env:RUNNER_TEMP\pywin32-requirements.txt"
            'pywin32==312 --hash=sha256:b457f6d628a47e8a7346ce22acb7e1a46a4a78b52e1d17e1af56871bd19a93bc' | Set-Content $pin
            python -m pip install --quiet --only-binary=:all: --require-hashes -r $pin
            if ($LASTEXITCODE -ne 0) { throw 'Could not install pywin32.' }
            $work = "$env:RUNNER_TEMP\repack"
            pwsh -NoProfile -File chromium/windows/repack-installer.ps1 -Phase unpack -Installer "$env:CANDIDATE_DIR\mini_installer.exe" -Work $work
            if ($LASTEXITCODE -ne 0) { throw 'Unpacking the installer failed.' }
            pwsh -NoProfile -File chromium/windows/repack-installer.ps1 -Phase pack -Installer "$env:CANDIDATE_DIR\mini_installer.exe" -Work $work -Output "$env:RUNNER_TEMP\mini_installer_repacked.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Packing the installer failed.' }
            New-Item -ItemType Directory "$env:RESULTS" -Force | Out-Null
            Copy-Item "$work\layout.json" "$env:RESULTS\repack-layout.json"
            node chromium/tests/windows-install.mjs "$env:CANDIDATE_DIR" "$env:RESULTS\install-repacked" "$shipping\Blanc-Setup-1.49.1.exe" "--installer=$env:RUNNER_TEMP\mini_installer_repacked.exe"
          } else {
            node chromium/tests/windows-install.mjs "$env:CANDIDATE_DIR" "$env:RESULTS\install" "$shipping\Blanc-Setup-1.49.1.exe"
          }
      - name: Crash capture
        if: ${{ !cancelled() }}
        run: |
          if (Test-Path chromium/tests/windows-crash.mjs) { node chromium/tests/windows-crash.mjs "$env:CANDIDATE_DIR" "$env:RESULTS\crash" } else { 'No crash check on this ref.' }
      # The suite runs even when the frame check failed: each is evidence.
      - name: Foundation suite
        if: ${{ !cancelled() && inputs.suite == 'f0' }}
        run: |
          # An empty filter is no filter: a full run must never be recorded as a subset.
          # One array, splatted: each element reaches node as one argument,
          # whatever PowerShell would make of a bare --name=value.with.dots.
          $arguments = @('chromium/windows/run-suite.mjs', $env:CANDIDATE_DIR, "$env:RESULTS\f0", '--slice=f0')
          if ($env:ONLY) { $arguments += "--only=$env:ONLY" }
          node @arguments
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-windows-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 14
