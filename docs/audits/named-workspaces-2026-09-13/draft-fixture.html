<!doctype html><html lang="en"><meta charset="utf-8"><title>Workspace audit draft</title><style>body{font:18px system-ui;margin:80px auto;max-width:720px;padding:24px}label{display:block;margin:24px 0 8px}textarea{font:18px system-ui;width:100%;height:180px;padding:12px}p{color:#555}</style><h1>Workspace audit draft</h1><p>Local test fixture. Text is deliberately kept only in memory. No data is submitted or stored.</p><label for="draft">Unsaved draft</label><textarea id="draft" placeholder="Enter audit text"></textarea><p id="status">No unsaved changes</p><script>const draft=document.querySelector('#draft');draft.addEventListener('input',()=>document.querySelector('#status').textContent=draft.value?'Unsaved changes — leaving should warn':'No unsaved changes');window.addEventListener('beforeunload',event=>{if(draft.value){event.preventDefault();event.returnValue='';}});</script></html>
