<!doctype html>
<meta charset="utf-8">
<title>Quieter warmth mockup</title>
<style>
  body { margin: 0; padding: 32px; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #888; color: #222; }
  h1 { font-size: 16px; margin: 0 0 4px; color: #fff; }
  p.note { margin: 0 0 24px; color: #eee; max-width: 760px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(320px, 440px)); gap: 20px; margin-bottom: 28px; }
  .label { color: #fff; font-weight: 600; margin-bottom: 6px; }
  .label small { font-weight: 400; opacity: .8; }

  .now.light  { --bg:#f8f2e8; --surface:#f2eade; --raised:#fff; --border:#e1d7c9; --text:#12100b; --dim:#6b6257; --accent:#805d28; --accent-dim:rgba(128,93,40,.16); }
  .now.dark   { --bg:#17130f; --surface:#2d251d; --raised:#221d17; --border:#4a3e31; --text:#f7f0e5; --dim:#b8aa98; --accent:#d4ad66; --accent-dim:rgba(212,173,102,.2); }
  .new.light  { --bg:#FBFAF6; --surface:#F3F1EB; --raised:#fff; --border:#E5E2DA; --text:#14130f; --dim:#6a665e; --accent:#1F1E1B; --accent-dim:rgba(20,19,15,.08); }
  .new.dark   { --bg:#1B1B1B; --surface:#262625; --raised:#202020; --border:#3A3A38; --text:#F3F1EC; --dim:#A9A69E; --accent:#F3F1EC; --accent-dim:rgba(243,241,236,.14); }

  .sheet { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .nav { display: flex; gap: 6px; margin-bottom: 14px; }
  .nav span { padding: 4px 10px; border-radius: 8px; color: var(--dim); }
  .nav span.cur { background: var(--surface); color: var(--text); }
  .island { display:flex; align-items:center; gap:8px; background: var(--raised); border:1px solid var(--border); border-radius: 999px; padding: 6px 14px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .island .dot { width:8px; height:8px; border-radius:50%; background: var(--dim); opacity:.5 }
  .island .dot.on { background: var(--accent); opacity:1 }
  .island .dom { margin-left:auto; color: var(--dim); }
  .card { background: var(--surface); border-radius: 10px; padding: 4px; }
  .row { display:flex; gap:10px; align-items:center; padding: 8px 10px; border-radius: 8px; }
  .row.hl { background: var(--accent-dim); }
  .row .fav { width:16px; height:16px; border-radius:4px; background: var(--border); }
  .row .meta { margin-left:auto; color: var(--dim); font-size: 12px; }
  kbd { background: var(--raised); border:1px solid var(--border); border-radius:5px; padding:1px 6px; font-size:11px; color: var(--dim); }
  .actions { display:flex; gap:8px; margin-top:12px; }
  button { font: inherit; border:0; border-radius:8px; padding:6px 12px; background: var(--surface); color: var(--text); }
  button.primary { background: var(--accent); color: var(--bg); }
  .sw { display:flex; gap:6px; margin-top:10px; font-size:11px; color: var(--dim); }
  .sw i { display:inline-block; width:14px; height:14px; border-radius:4px; border:1px solid var(--border); vertical-align:-3px; margin-right:3px; }
</style>
<h1>Quieter warmth: Blanc in-app surfaces</h1>
<p class="note">Left: shipped Sunrise tokens. Right: the Neutral proposal (light page <b>#FBFAF6</b>, dark page <b>#1B1B1B</b>). The surface, border and text tokens are a barely-warm neutral so cards still separate from the page. Accents are monochrome ink instead of gold.</p>

<template id="t">
  <div class="sheet">
    <div class="nav"><span>Favorites</span><span class="cur">History</span><span>Downloads</span></div>
    <div class="island"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span>Release notes</span><span class="dom">example.com</span></div>
    <div class="card">
      <div class="row hl"><span class="fav"></span>Version 1.54.0 notes<span class="meta">Today</span></div>
      <div class="row"><span class="fav"></span>Blanc Browser: Downloads<span class="meta">Today</span></div>
      <div class="row"><span class="fav"></span>Release notes<span class="meta"><kbd>⌘L</kbd></span></div>
    </div>
    <div class="actions"><button class="primary">Clear history</button><button>Close</button></div>
    <div class="sw" data-sw></div>
  </div>
</template>

<div id="out"></div>
<script>
  const rows = [['light','Light'],['dark','Dark']];
  const out = document.getElementById('out');
  for (const [m, name] of rows) {
    const g = document.createElement('div'); g.className = 'grid'; out.appendChild(g);
    for (const [v, title] of [['now','Current (Sunrise)'],['new','Proposed (Neutral)']]) {
      const w = document.createElement('div');
      w.innerHTML = `<div class="label">${name}: ${title}</div>`;
      const node = document.getElementById('t').content.cloneNode(true);
      const wrap = document.createElement('div'); wrap.className = `${v} ${m}`; wrap.appendChild(node);
      w.appendChild(wrap); g.appendChild(w);
      const sw = wrap.querySelector('[data-sw]');
      const cs = getComputedStyle(wrap);
      sw.innerHTML = ['bg','surface','border'].map(k => `<span><i style="background:${cs.getPropertyValue('--'+k)}"></i>${cs.getPropertyValue('--'+k).trim()}</span>`).join('');
    }
  }
</script>
