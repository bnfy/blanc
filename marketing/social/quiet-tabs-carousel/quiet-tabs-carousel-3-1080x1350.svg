    <text x="1020" y="56" text-anchor="end" class="mono" font-size="17" fill="#9c9c9c" style="fill:#9c9c9c">3 / 4</text>
    
    <text x="540" y="265" class="hero" fill="#f5f5f5" style="fill:#f5f5f5">
      <tspan x="540">Your work in</tspan><tspan x="540" dy="114">progress stays live.</tspan>
    </text>
    <text x="540" y="565" class="sub" fill="#9c9c9c" style="fill:#9c9c9c">Forms, media, pins, and permission prompts keep their live page.</text>
    <g transform="translate(60 770)">
    <rect width="450" height="162" rx="28" fill="#191919" stroke="#333333" stroke-width="2"/>
