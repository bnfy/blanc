    <text x="64" y="50" class="mono" font-size="19" fill="#f5f5f5" style="fill:#f5f5f5">IN PROGRESS</text>
    <text x="38" y="101" font-size="24" fill="#9c9c9c" style="fill:#9c9c9c">half-filled forms</text>
  </g>
    <g transform="translate(570 770)">
    <rect width="450" height="162" rx="28" fill="#191919" stroke="#333333" stroke-width="2"/>
    <circle cx="38" cy="42" r="10" fill="#f5f5f5"/>
    <text x="64" y="50" class="mono" font-size="19" fill="#f5f5f5" style="fill:#f5f5f5">PLAYING</text>
    <text x="38" y="101" font-size="24" fill="#9c9c9c" style="fill:#9c9c9c">audio or video</text>
  </g>
    <g transform="translate(60 962)">
    <rect width="450" height="162" rx="28" fill="#191919" stroke="#333333" stroke-width="2"/>
    <circle cx="38" cy="42" r="10" fill="#f5f5f5"/>
    <text x="64" y="50" class="mono" font-size="19" fill="#f5f5f5" style="fill:#f5f5f5">KEPT CLOSE</text>
    <text x="38" y="101" font-size="24" fill="#9c9c9c" style="fill:#9c9c9c">pinned tabs</text>
  </g>
    <g transform="translate(570 962)">
    <rect width="450" height="162" rx="28" fill="#191919" stroke="#333333" stroke-width="2"/>
    <circle cx="38" cy="42" r="10" fill="#f5f5f5"/>
    <text x="64" y="50" class="mono" font-size="19" fill="#f5f5f5" style="fill:#f5f5f5">WAITING</text>
