<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
    <defs>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.14"/>
      </filter>
      <style>
        text { font-family: "Inter Variable", Inter, Arial, sans-serif; fill: #f5f5f5; }
        .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
        .hero { font-size: 104px; font-weight: 500; letter-spacing: -3.6px; text-anchor: middle; }
        .sub { font-size: 31px; font-weight: 400; letter-spacing: -0.4px; text-anchor: middle; }
      </style>
    </defs>
    <rect width="1080" height="1350" fill="#0e0e0e"/>
    <line x1="60" y1="82" x2="1020" y2="82" stroke="#333333"/>
    <text x="60" y="56" class="mono" font-size="17" letter-spacing="3" fill="#9c9c9c" style="fill:#9c9c9c">BLANC / QUIET TABS</text>
    <text x="1020" y="56" text-anchor="end" class="mono" font-size="17" fill="#9c9c9c" style="fill:#9c9c9c">1 / 4</text>
    
    <text x="540" y="265" class="hero" fill="#f5f5f5" style="fill:#f5f5f5">
      <tspan x="540">Your laptop has</tspan><tspan x="540" dy="114">enough to do.</tspan>
    </text>
    <text x="540" y="560" class="sub" fill="#9c9c9c" style="fill:#9c9c9c">
      <tspan x="540">It does not need to keep every inactive page running.</tspan><tspan x="540" dy="46">Keep the tabs you need. Free up memory from the rest.</tspan>
    </text>
    <g filter="url(#shadow)">
    <rect x="110" y="820" width="860" height="116" rx="58" fill="#0e0e0e" stroke="#333333" stroke-width="2"/>
    <circle cx="182" cy="878" r="13" fill="none" stroke="#ffffff" stroke-width="2"/><circle cx="182" cy="878" r="5" fill="#ffffff"/><circle cx="236" cy="878" r="11" fill="#ffffff"/><circle cx="290" cy="878" r="11" fill="#ffffff"/><circle cx="344" cy="878" r="13" fill="none" stroke="#ffffff" stroke-width="2"/><circle cx="344" cy="878" r="5" fill="#ffffff"/><circle cx="398" cy="878" r="11" fill="#ffffff"/><circle cx="452" cy="878" r="11" fill="#ffffff"/>
    <line x1="530" y1="854" x2="530" y2="902" stroke="#333333"/>
    <circle cx="572" cy="878" r="16" fill="#ffffff"/>
    <text x="604" y="888" font-size="25" fill="#f5f5f5" style="fill:#f5f5f5">blancbrowser.com</text>
  </g>
    <g transform="translate(60 1095)">
      <circle cx="13" cy="13" r="12" fill="none" stroke="#f5f5f5" stroke-width="2"/><circle cx="13" cy="13" r="5" fill="#f5f5f5"/>
      <text x="42" y="21" class="mono" font-size="21" fill="#9c9c9c" style="fill:#9c9c9c">page unloaded</text>
      <circle cx="340" cy="13" r="11" fill="#f5f5f5"/>
      <text x="368" y="21" class="mono" font-size="21" fill="#9c9c9c" style="fill:#9c9c9c">live page</text>
    </g>
  
  </svg>