<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
    
    <defs>
      <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="18" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="table" tableValues="0 0.055"/></feComponentTransfer>
      </filter>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
      </filter>
      <style>
        text { font-family: Inter, Arial, sans-serif; fill: #f5f5f5; }
        .caps { font-weight: 900; letter-spacing: -5px; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; }
      </style>
    </defs>
    <rect width="1080" height="1920" fill="#0e0e0e"/>
    <rect width="1080" height="1920" fill="#0e0e0e" filter="url(#grain)" opacity="0.16"/>
    
    
    <rect x="72" y="100" width="510" height="62" rx="31" fill="#ffffff"/>
    <text x="102" y="142" class="mono" font-size="30" letter-spacing="4" fill="#0e0e0e" style="fill:#0e0e0e">TAB COUNT CONFESSION</text>
    <circle cx="930" cy="180" r="285" fill="none" stroke="#333333" stroke-width="4"/>
    
    <g transform="rotate(8 870 295)" filter="url(#shadow)">
      <rect x="760" y="235" width="220" height="120" rx="24" fill="#ffffff" fill-opacity="1" stroke="#0e0e0e" stroke-width="5"/>
      <circle cx="787" cy="261" r="8" fill="#0e0e0e"/>
      <line x1="810" y1="261" x2="956" y2="261" stroke="#0e0e0e" stroke-width="6" stroke-linecap="round" opacity="0.24"/>
    </g>
    
    <g transform="rotate(-7 785 527.5)" filter="url(#shadow)">
      <rect x="650" y="460" width="270" height="135" rx="27" fill="#191919" fill-opacity="1" stroke="#333333" stroke-width="5"/>
      <circle cx="677" cy="486" r="8" fill="#f5f5f5"/>
      <line x1="700" y1="486" x2="896" y2="486" stroke="#f5f5f5" stroke-width="6" stroke-linecap="round" opacity="0.24"/>
    </g>
    
    <g transform="rotate(10 910 742.5)" filter="url(#shadow)">
      <rect x="815" y="690" width="190" height="105" rx="21" fill="#ffffff" fill-opacity="0.86" stroke="#0e0e0e" stroke-width="5"/>
      <circle cx="842" cy="716" r="8" fill="#0e0e0e"/>
      <line x1="865" y1="716" x2="981" y2="716" stroke="#0e0e0e" stroke-width="6" stroke-linecap="round" opacity="0.24"/>
    </g>
    <text x="72" y="710" class="caps" font-size="146" fill="#f5f5f5" style="fill:#f5f5f5">
      <tspan x="72">DON'T</tspan><tspan x="72" dy="154">CLEAN</tspan><tspan x="72" dy="154">UP.</tspan>
    </text>
    <text x="76" y="1305" class="mono" font-size="42" fill="#f5f5f5" style="fill:#f5f5f5">WE CAN TELL.</text>
  
  </svg>