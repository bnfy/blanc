<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
    
    <defs>
      <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="18" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="table" tableValues="0 0.055"/></feComponentTransfer>
      </filter>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
      </filter>
      <style>
        text { font-family: Inter, Arial, sans-serif; fill: #f5f5f5; }
        .caps { font-weight: 900; letter-spacing: -5px; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; }
      </style>
    </defs>
    <rect width="1080" height="1920" fill="#0e0e0e"/>
    <rect width="1080" height="1920" fill="#0e0e0e" filter="url(#grain)" opacity="0.16"/>
    
    
    <rect x="72" y="100" width="510" height="62" rx="31" fill="#ffffff"/>
    <text x="102" y="142" class="mono" font-size="30" letter-spacing="4" fill="#0e0e0e" style="fill:#0e0e0e">PICK YOUR DAMAGE.</text>
    <circle cx="920" cy="245" r="320" fill="none" stroke="#333333" stroke-width="4"/>
    <text x="72" y="485" class="caps" font-size="122" fill="#f5f5f5" style="fill:#f5f5f5">
      <tspan x="72">YOUR TAB</tspan><tspan x="72" dy="128">COUNT IS…</tspan>
    </text>
    
    <g transform="rotate(-1.5 290 932)" filter="url(#shadow)">
      <rect x="70" y="865" width="440" height="134" rx="67" fill="#191919" stroke="#333333" stroke-width="6"/>
      <text x="290" y="950" text-anchor="middle" class="mono" font-size="44" fill="#f5f5f5" style="fill:#f5f5f5">0–10</text>
    </g>
    
    <g transform="rotate(1.5 790 932)" filter="url(#shadow)">
      <rect x="570" y="865" width="440" height="134" rx="67" fill="#191919" stroke="#333333" stroke-width="6"/>
      <text x="790" y="950" text-anchor="middle" class="mono" font-size="44" fill="#f5f5f5" style="fill:#f5f5f5">11–30</text>
    </g>
    
    <g transform="rotate(1.2 290 1122)" filter="url(#shadow)">
      <rect x="70" y="1055" width="440" height="134" rx="67" fill="#191919" stroke="#333333" stroke-width="6"/>
      <text x="290" y="1140" text-anchor="middle" class="mono" font-size="44" fill="#f5f5f5" style="fill:#f5f5f5">31–100</text>
    </g>
    
    <g transform="rotate(-1.2 790 1122)" filter="url(#shadow)">
      <rect x="570" y="1055" width="440" height="134" rx="67" fill="#ffffff" stroke="#ffffff" stroke-width="6"/>
      <text x="790" y="1140" text-anchor="middle" class="mono" font-size="44" fill="#0e0e0e" style="fill:#0e0e0e">LOST COUNT</text>
    </g>
    <text x="540" y="1445" text-anchor="middle" class="mono" font-size="40" fill="#f5f5f5" style="fill:#f5f5f5">DON'T LIE. WE'VE ALL BEEN THERE.</text>
  
  </svg>