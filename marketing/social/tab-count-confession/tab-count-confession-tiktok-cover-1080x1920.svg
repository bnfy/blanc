<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
    
    <defs>
      <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="18" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="table" tableValues="0 0.055"/></feComponentTransfer>
      </filter>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
      </filter>
      <style>
        text { font-family: Inter, Arial, sans-serif; fill: #0e0e0e; }
        .caps { font-weight: 900; letter-spacing: -5px; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; }
      </style>
    </defs>
    <rect width="1080" height="1920" fill="#ffffff"/>
    <rect width="1080" height="1920" fill="#0e0e0e" filter="url(#grain)" opacity="0.16"/>
    
    <circle cx="925" cy="225" r="325" fill="#f7f7f7" stroke="#dedede" stroke-width="4"/>
    
    <g transform="rotate(8 855 280)" filter="url(#shadow)">
      <rect x="735" y="215" width="240" height="130" rx="26" fill="#0e0e0e" fill-opacity="1" stroke="#0e0e0e" stroke-width="5"/>
      <circle cx="762" cy="241" r="8" fill="#f5f5f5"/>
      <line x1="785" y1="241" x2="951" y2="241" stroke="#f5f5f5" stroke-width="6" stroke-linecap="round" opacity="0.24"/>
    </g>
    
    <rect x="72" y="140" width="510" height="62" rx="31" fill="#0e0e0e"/>
    <text x="102" y="182" class="mono" font-size="30" letter-spacing="4" fill="#ffffff" style="fill:#ffffff">DON'T CLEAN UP FIRST.</text>
    <text x="70" y="620" class="caps" font-size="132">
      <tspan x="70">HOW MANY</tspan><tspan x="70" dy="142">TABS?</tspan>
    </text>
    
    <g transform="rotate(-1.2 290 1077)" filter="url(#shadow)">
      <rect x="70" y="1010" width="440" height="134" rx="67" fill="#191919" stroke="#333333" stroke-width="6"/>
      <text x="290" y="1095" text-anchor="middle" class="mono" font-size="44" fill="#f5f5f5" style="fill:#f5f5f5">0–10</text>
    </g>
    
    <g transform="rotate(1.2 790 1077)" filter="url(#shadow)">
      <rect x="570" y="1010" width="440" height="134" rx="67" fill="#191919" stroke="#333333" stroke-width="6"/>
      <text x="790" y="1095" text-anchor="middle" class="mono" font-size="44" fill="#f5f5f5" style="fill:#f5f5f5">11–30</text>
    </g>
    
    <g transform="rotate(1.1 290 1262)" filter="url(#shadow)">
      <rect x="70" y="1195" width="440" height="134" rx="67" fill="#191919" stroke="#333333" stroke-width="6"/>
      <text x="290" y="1280" text-anchor="middle" class="mono" font-size="44" fill="#f5f5f5" style="fill:#f5f5f5">31–100</text>
    </g>
    
    <g transform="rotate(-1.1 790 1262)" filter="url(#shadow)">
      <rect x="570" y="1195" width="440" height="134" rx="67" fill="#ffffff" stroke="#ffffff" stroke-width="6"/>
      <text x="790" y="1280" text-anchor="middle" class="mono" font-size="44" fill="#0e0e0e" style="fill:#0e0e0e">LOST COUNT</text>
    </g>
    <text x="540" y="1570" text-anchor="middle" class="mono" font-size="42">TAB COUNT CONFESSION</text>
    <text x="540" y="1640" text-anchor="middle" class="mono" font-size="34">@BLANCBROWSER</text>
  
  </svg>